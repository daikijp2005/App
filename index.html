<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家計簿アプリ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <header class="app-header">
      <p class="eyebrow">Household Budget</p>
      <h1>家計簿アプリ</h1>
    </header>

    <nav class="month-nav" aria-label="表示する月">
      <button type="button" class="month-btn" id="prev-month" aria-label="前の月">‹</button>
      <h2 id="month-label" class="month-label"></h2>
      <button type="button" class="month-btn" id="next-month" aria-label="次の月">›</button>
    </nav>

    <div class="stats" id="stats"></div>

    <form id="entry-form" class="entry-form">
      <div class="type-toggle" role="radiogroup" aria-label="種類">
        <label><input type="radio" name="type" value="expense" checked><span>支出</span></label>
        <label><input type="radio" name="type" value="income"><span>収入</span></label>
      </div>
      <div class="form-row">
        <input type="date" id="date" required aria-label="日付">
        <select id="category" required aria-label="カテゴリ"></select>
        <input type="number" id="amount" placeholder="金額（円）" min="1" step="1" inputmode="numeric" required aria-label="金額">
        <input type="text" id="memo" placeholder="メモ（任意）" maxlength="60" aria-label="メモ">
        <button type="submit">追加</button>
      </div>
    </form>

    <section class="breakdown" aria-labelledby="breakdown-title">
      <h3 id="breakdown-title" class="section-title">支出の内訳</h3>
      <ul id="breakdown-list" class="breakdown-list"></ul>
      <p id="breakdown-empty" class="muted" hidden>この月の支出はまだありません。</p>
    </section>

    <div class="filters" role="tablist">
      <button class="filter-btn active" data-filter="all">すべて</button>
      <button class="filter-btn" data-filter="expense">支出</button>
      <button class="filter-btn" data-filter="income">収入</button>
    </div>

    <ul id="entry-list" class="entry-list"></ul>

    <p id="empty-message" class="empty-message" hidden>この月の記録はまだありません。上のフォームから追加してください。</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
