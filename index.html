<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>マイページ | 自分の脳内マップ</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="hub.css">
</head>
<body>
  <div class="page hub-page">
    <header class="app-header">
      <p class="eyebrow">My Mind Map</p>
      <h1 id="greeting">こんにちは</h1>
      <p class="tagline" id="date-line"></p>
    </header>

    <section class="now-strip" id="now-strip">
      <span class="now-strip-label">いまやること</span>
      <span class="now-strip-task" id="now-strip-task">読み込み中...</span>
      <a href="tasks.html" class="now-strip-link">開く →</a>
    </section>

    <div class="hub-grid">
      <a class="hub-card" data-card="hobbies" href="hobbies.html">
        <span class="hub-icon">🎨</span>
        <span class="hub-title">趣味・好きな事</span>
        <span class="hub-summary" id="summary-hobbies">読み込み中...</span>
      </a>
      <a class="hub-card" data-card="people" href="people.html">
        <span class="hub-icon">🧑‍🤝‍🧑</span>
        <span class="hub-title">人</span>
        <span class="hub-summary" id="summary-people">読み込み中...</span>
      </a>
      <a class="hub-card" data-card="tasks" href="tasks.html">
        <span class="hub-icon">🎯</span>
        <span class="hub-title">やるべき事</span>
        <span class="hub-summary" id="summary-tasks">読み込み中...</span>
      </a>
      <a class="hub-card" data-card="study" href="study.html">
        <span class="hub-icon">📚</span>
        <span class="hub-title">学業</span>
        <span class="hub-summary" id="summary-study">読み込み中...</span>
      </a>
      <a class="hub-card" data-card="job" href="job.html">
        <span class="hub-icon">💼</span>
        <span class="hub-title">就活</span>
        <span class="hub-summary" id="summary-job">読み込み中...</span>
      </a>
    </div>
  </div>

  <script src="hub.js"></script>
</body>
</html>
