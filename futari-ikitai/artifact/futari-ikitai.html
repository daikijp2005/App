        <button class="btn rose block">${switching ? "新しいメンバーとして参加" : "参加する"}</button>
      </form>
      ${ppl.length ? `<div class="label">すでにメンバーの人はこちら</div><div class="chips wrap-chips">${ppl.map((p) => `<button class="chip" data-me="${esc(p.id)}">${av(p.id, "xs")}${esc(p.name)}</button>`).join("")}</div>` : ""}`);
    root.addEventListener("click", (e) => { const b = e.target.closest("[data-me]"); if (!b) return; B.setMe(b.dataset.me); close(); toast(`${person(b.dataset.me).name}さん、おかえりなさい`); render(); });
    root.querySelector("#join-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = root.querySelector("#j-name").value.trim();
      if (!name) return;
      const m = await act(() => B.join(name));
      if (m) { close(); toast(`${name}さん、ようこそ`); render(); }
    });
    setTimeout(() => root.querySelector("#j-name")?.focus(), 80);
  }

  // 誰と使うかを選ぶ（アーティファクト版で最初に開いた人用）
  function typeSheet() {
    const { root, close } = sheet(`${head("誰と使いますか？")}<p class="sub" style="margin-top:0">あとから設定で変えられます。</p>
      <div class="type-grid">${Object.entries(GROUP_TYPES).map(([k, t]) => `<button class="type-tile" data-type="${k}"><span class="emoji">${t.emoji}</span><b>${esc(t.label)}</b><small>${esc(t.desc)}</small></button>`).join("")}</div>`);
    root.addEventListener("click", async (e) => {
      const b = e.target.closest("[data-type]");
      if (!b) return;
      const t = GROUP_TYPES[b.dataset.type];
      const patch = { type: b.dataset.type, ...(S.settings.name === "行きたいリスト" || !S.settings.name ? { name: t.listName } : {}) };
      if (await act(() => B.saveSettings(patch))) { S.settings = { ...S.settings, ...patch }; close(); render(); }
    });
  }

  function openLists() {
    const lists = B.lists();
    const { root } = sheet(`${head("リスト")}
      <div class="panel" style="padding:6px 14px">${lists.map((l) => `<a class="memory" href="${esc(l.url)}" style="text-decoration:none;color:inherit;grid-template-columns:44px 1fr auto;align-items:center">
        <span class="ph" style="width:44px;height:44px;font-size:22px;--tint:${TINT.other}">${(GROUP_TYPES[l.type] || GROUP_TYPES.friends).emoji}</span>
        <span style="min-width:0"><b>${esc(l.name)}</b><div class="sub">${esc((GROUP_TYPES[l.type] || GROUP_TYPES.friends).label)}${l.count != null ? ` ・ ${l.count}件` : ""}</div></span>
        ${l.current ? `<span class="tag plan">表示中</span>` : ""}</a>`).join("")}</div>
      <a class="btn rose block" style="margin-top:12px" href="${esc(B.newListUrl())}">${ic("plus", "sm")}新しいリストを作る</a>
      <p class="sub">恋人用・友達用・家族用など、使う相手ごとにリストを分けられます。</p>`);
    return root;
  }

  // 初めて開いたとき：使い方スライド → （Webアプリ）参加 →（アーティファクト）誰と使うか
  function firstRun() {
    const next = () => {
      if (F.members && !me()) return joinSheet();
      if (!S.settings.type && B.kind === "artifact") return typeSheet();
    };
    if (!local.get("onboarded", false)) showOnboarding(() => { local.set("onboarded", true); next(); });
    else next();
  }

  // ---------- 画面遷移・イベント ----------
  function go(view) { S.view = view; local.set("view", view); render(); window.scrollTo({ top: 0 }); }

  $app.addEventListener("click", async (e) => {
    const t = e.target.closest("[data-act],[data-view],[data-seg],[data-like],[data-open],[data-vote],[data-pstyle],[data-pstops],[data-take],[data-genre],[data-ptab],[data-cal],[data-day]");
    if (!t) return;
    if (t.dataset.like) { e.stopPropagation(); const it = S.spots.find((s) => s.id === t.dataset.like); return vote(it.id, myVote(it) === true ? null : true); }
    if (t.dataset.vote) { const it = S.spots.find((s) => s.id === $("swipe")?.dataset.id); return it && decide(it, t.dataset.vote); }
    if (t.dataset.open) return openDetail(t.dataset.open);
    if (t.dataset.genre !== undefined) { S.f.genres = t.dataset.genre ? new Set([t.dataset.genre]) : new Set(); return renderView(); }
    if (t.dataset.ptab) { S.planTab = t.dataset.ptab; return renderView(); }
    if (t.dataset.day) { S.calDay = t.dataset.day; return renderView(); }
    if (t.dataset.cal) {
      if (t.dataset.cal === "today") { S.calMonth = ""; S.calDay = ""; return renderView(); }
      const [y, m] = (S.calMonth || todayStr().slice(0, 7)).split("-").map(Number);
      const d = new Date(y, m - 1 + Number(t.dataset.cal), 1);
      S.calMonth = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
      return renderView();
    }
    if (t.dataset.view) return go(t.dataset.view);
    if (t.dataset.seg) { S.seg = t.dataset.seg; if (S.view !== "home") return go("home"); return renderView(); }
    if (t.dataset.pstyle) { S.plan.style = t.dataset.pstyle; return renderView(); }
    if (t.dataset.pstops) { S.plan.stops = Number(t.dataset.pstops); return renderView(); }
    if (t.dataset.take) {
      const c = S.courses?.[Number(t.dataset.take)];
      if (!c) return;
      for (const [i, s] of c.stops.entries()) await B.updateSpot(s.spot.id, { status: "planned", plannedDate: S.plan.date, planTime: s.arrive, planOrder: i }).catch(() => null);
      S.courses = null;
      toast(`${jpDate(S.plan.date)}の予定に入れました`);
      return render();
    }
    const a = t.dataset.act;
    if (a === "settings") openSettings();
    if (a === "lists") openLists();
    if (a === "invite") openInvite();
    if (a === "ask") openAsk();
    if (a === "members") openMembers();
    if (a === "addday") openAddDay();
    if (a === "bases") openSettings("bases");
    if (a === "add") openAdd();
    if (a === "filters") openFilters();
    if (a === "gacha") openGacha();
    if (a === "mode") { S.listMode = S.listMode === "map" ? "grid" : "map"; renderView(); }
    if (a === "clear") { Object.assign(S.f, { genres: new Set(), price: "", travel: "", area: "", who: "", openNow: false }); S.q = ""; S.seg = "all"; renderView(); }
    if (a === "unskip") { S.skipped.clear(); renderView(); }
    if (a === "pboth") { S.plan.bothOnly = !S.plan.bothOnly; renderView(); }
    if (a === "build") {
      S.plan.date = $("p-date").value || S.plan.date;
      S.plan.budget = $("p-budget").value;
      S.courses = buildCourses(S.spots, { stops: S.plan.stops, style: S.plan.style, budget: S.plan.budget ? Number(S.plan.budget) : null, bothOnly: S.plan.bothOnly, date: S.plan.date, peopleCount: Math.max(2, peopleList().length) });
      renderView();
      document.getElementById("courses")?.scrollIntoView({ behavior: "smooth", block: "start" });
    }
  });
  $app.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && e.target.matches(".card")) openDetail(e.target.dataset.open);
    if (S.view === "match" && !$modal.firstElementChild && (e.key === "ArrowRight" || e.key === "ArrowLeft")) {
      const it = S.spots.find((s) => s.id === $("swipe")?.dataset.id);
      if (it) decide(it, e.key === "ArrowRight" ? "yes" : "no");
    }
  });
  $app.addEventListener("submit", (e) => {
    if (e.target.id !== "adder") return;
    e.preventDefault();
    const v = $("add-url").value.trim();
    if (!v) return openAdd();
    $("add-url").value = "";
    openAdd(v);
  });
  // コピーしたリンクをどこかで貼り付けたら、そのまま追加画面へ
  $app.addEventListener("paste", (e) => {
    if (e.target.id !== "add-url") return;
    const text = e.clipboardData?.getData("text") || "";
    if (/https?:\/\//.test(text)) { e.preventDefault(); openAdd(text); }
  });
  let qTimer;
  $app.addEventListener("input", (e) => {
    if (e.target.id !== "q") return;
    S.q = e.target.value;
    clearTimeout(qTimer);
    qTimer = setTimeout(() => { const pos = e.target.selectionStart; renderView(); const q = $("q"); q?.focus(); q?.setSelectionRange(pos, pos); }, 200);
  });
  $app.addEventListener("change", (e) => {
    if (e.target.id === "group") { S.groupBy = e.target.value; local.set("groupBy", S.groupBy); renderView(); }
    if (e.target.id === "base-select") { S.baseId = e.target.value; local.set("baseId", S.baseId); renderView(); }
    if (e.target.id === "p-date") S.plan.date = e.target.value;
    if (e.target.id === "p-budget") S.plan.budget = e.target.value;
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && $modal.firstElementChild) $modal.innerHTML = ""; });

  // ---------- データの受け取り ----------
  const theme = local.get("theme", null);
  if (theme) document.documentElement.dataset.theme = theme;
  applyAccent(local.get("accent", ""));
  render();
  B.subscribe(({ settings, spots }) => {
    const before = new Set(S.spots.map((s) => s.id));
    const wasLoaded = S.loaded;
    if (settings) S.settings = { name: "行きたいリスト", bases: [], ...settings };
    if (spots) S.spots = spots;
    S.loaded = true;
    if (wasLoaded && spots) {
      for (const it of spots) if (!before.has(it.id) && it.addedBy && it.addedBy !== me()) toast(`${pname(it.addedBy)}が「${nameOf(it)}」を追加しました`);
    }
    render();
    refreshDetail();
    if (!wasLoaded) firstRun();
  });

  return { openAdd, go, invite: openInvite };
}

// アーティファクト版の入り口：claude.ai の共有データベース（db）と Claude（sample）を使う backend を作り、画面は core.js に任せる


const DB_ERRORS = {
  invalid_argument: "編集する権限がありません。リストの持ち主に「編集できる」で共有してもらってください",
  quota_exceeded: "保存できる量の上限です。いらないスポットを削除してください",
  resource_exhausted: "操作が多すぎます。少し待ってからもう一度試してください",
};
const SAMPLE_OFF = ["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"];

async function artifactBackend() {
  const [db, user, sample] = await Promise.all([claude.use("db"), claude.use("user"), claude.use("sample")]);
  const meId = user ? await user.id() : null;
  const limits = sample ? await sample.limits().catch(() => null) : null;
  let aiOn = Boolean(sample);
  let profiles = {};
  let spots = [];
  let settings = null;
  let listener = () => {};
  const emit = () => listener({ settings, spots });

  const wrap = (p) => p.catch((e) => { throw new Error(DB_ERRORS[e?.code] || "保存できませんでした。少し待ってからもう一度試してください"); });
  const idsInUse = (list = spots) => [...new Set([meId, ...list.flatMap((s) => [s.addedBy, ...Object.keys(s.likes || {}), ...(s.comments || []).map((c) => c.by)])].filter(Boolean))];
  const sampleError = (e) => {
    if (SAMPLE_OFF.includes(e?.code)) { aiOn = false; return "この表示ではAI読み取りを使えません"; }
    if (e?.code === "rate_limited") return "AIの利用が混み合っています。少し時間をおいて試してください";
    if (e?.code === "image_rejected") return "この画像は読み取れませんでした。別のスクリーンショットを選んでください";
    if (e?.code === "invalid_json" || e?.code === "empty_completion") return "うまく読み取れませんでした。本文を貼ってもう一度試してください";
    return "読み取りに失敗しました。もう一度試してください";
  };

  return {
    kind: "artifact",
    unavailable: db ? "" : "claude.ai にサインインして開くと、みんなで共有して使えます。",
    features: { map: false, thumbnails: false, aiButton: aiOn, askAI: aiOn, aiImage: Boolean(limits?.images), ics: false, invite: false, members: false, lists: false, export: false, clipboardRead: false, geolocation: false },
    shareNote: "一緒に使う人も claude.ai にサインインしている必要があります。サインインなしで使うなら Webアプリ版を使ってください。",
    readerNote: aiOn ? "本文を読み取り、「AIで読み取る」でClaudeが整理します（押した人の利用枠を使います）" : "本文をルールで読み取っています",
    subscribe(fn) {
      listener = fn;
      if (!db) { settings = {}; emit(); return; }
      db.collection("spots").onSnapshot(async (snap) => {
        const next = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
        // 名前を引いてから差し替える（先に差し替えると「相手」と表示されてしまう）
        if (user) profiles = await user.profiles(idsInUse(next));
        spots = next;
        emit();
      }, () => emit());
      db.doc("meta/settings").onSnapshot((d) => { settings = d.exists ? d.data() : {}; emit(); }, () => {});
    },
    me: () => meId,
    setMe() {},
    needsPick: () => false,
    // ニックネームとアイコンはリストの設定に保存し、claude.ai の名前・写真より優先する
    people: () => idsInUse().map((id) => ({ id, name: settings?.nicknames?.[id] || profiles[id]?.name || "", color: profiles[id]?.color || "#9a8a8f", avatar: settings?.avatars?.[id] || profiles[id]?.avatarUrl || "" })),
    renameMember: (id, name) => wrap(db.doc("meta/settings").set({ name: "行きたいリスト", bases: [], ...(settings || {}), nicknames: { ...(settings?.nicknames || {}), [id]: name } })),
    setAvatar: (id, avatar) => wrap(db.doc("meta/settings").set({ name: "行きたいリスト", bases: [], ...(settings || {}), avatars: { ...(settings?.avatars || {}), [id]: avatar } })),
    addSpot: (body) => wrap(db.collection("spots").add({ ...body, status: "want", likes: meId ? { [meId]: true } : {}, comments: [], addedBy: meId, createdAt: new Date().toISOString() })),
    updateSpot: (id, patch) => wrap(db.collection("spots").doc(id).update({ ...patch, updatedAt: new Date().toISOString() })),
    deleteSpot: (id) => wrap(db.collection("spots").doc(id).delete()),
    vote: (id, value) => wrap(db.collection("spots").doc(id).update({ likes: { [meId]: value } })),
    comment(id, text) {
      const it = spots.find((s) => s.id === id);
      return wrap(db.collection("spots").doc(id).update({ comments: [...(it?.comments || []), { by: meId, text, at: new Date().toISOString() }].slice(-100) }));
    },
    saveSettings: (patch) => wrap(db.doc("meta/settings").set({ name: "行きたいリスト", bases: [], ...(settings || {}), ...patch })),
    async readPost({ url = "", text = "", image = null, ai = false }) {
      const cleanUrl = url ? normalizeUrl(url) : "";
      const draft = { ...analyzeText(text), url: cleanUrl, platform: cleanUrl ? detectPlatform(cleanUrl) : "web", caption: text, ...(coordsFrom(url) || coordsFrom(text) || {}) };
      if (!ai) return draft;
      if (!aiOn) throw new Error("この表示ではAI読み取りを使えません");
      const genres = GENRES.map((g) => `"${g.id}"(${g.label})`).join("/");
      const prompt = `SNSで見つけたお出かけ先を整理しています。次の投稿から、行きたい場所の情報をJSONで返してください。\n` +
        `わからない項目は空文字かnullにし、投稿にない値段や営業時間は作らないでください。\n` +
        `lat/lng は、店名や住所・駅名から位置をおおよそ特定できるときだけ、あなたの知識で推定してください（わからなければnull）。\n` +
        `今日は ${new Date().toISOString().slice(0, 10)} です。` + (image ? "添付画像は投稿のスクリーンショットです。写っている文字も読んでください。" : "") + `\n` +
        `返すJSON: {"placeName":"店名・施設名","address":"住所","prefecture":"都道府県","city":"市区町村","station":"最寄り駅","genre":${genres},"priceMin":1人あたりの最低価格(円・数値かnull),"priceMax":数値かnull,"hours":"営業時間","closed":"定休日","deadline":"期間限定の終了日 YYYY-MM-DD か空文字","summary":"どんな場所かを40字以内で紹介","lat":数値かnull,"lng":数値かnull}\n\n` +
        `<post>\nURL: ${cleanUrl || "なし"}\n本文:\n${String(text).slice(0, 4000)}\n</post>`;
      try {
        const res = await sample.json(prompt, image ? { images: image } : {});
        if (!res || typeof res !== "object") throw { code: "invalid_json" };
        const out = { ...draft, aiUsed: true };
        for (const [k, v] of Object.entries(res)) if (v !== "" && v != null && (out[k] === "" || out[k] == null || out[k] === "other")) out[k] = v;
        if (res.lat != null && Number.isFinite(Number(res.lat))) { out.lat = Number(res.lat); out.lng = Number(res.lng); out.geoNote = "AIが推定した位置です"; }
        return out;
      } catch (e) {
        throw new Error(sampleError(e));
      }
    },
    async ask(question, items) {
      if (!aiOn) throw new Error("この表示ではAIを使えません");
      const prompt = `行きたい場所を貯めたリストがあります。うろ覚えの質問に当てはまりそうな場所を、当てはまる順に最大5つ選んでください。\n` +
        `当てはまるものがなければ空の配列にしてください。reason は「なぜそれっぽいか」を20字ほどで。\n` +
        `返すJSON: {"picks":[{"id":"リストのid","reason":"理由"}]}\n\n質問: ${question}\n\nリスト:\n${JSON.stringify(items).slice(0, 60000)}`;
      try {
        const r = await sample.json(prompt);
        return Array.isArray(r?.picks) ? r.picks : [];
      } catch (e) {
        throw new Error(sampleError(e));
      }
    },
    async locate(q) {
      const c = coordsFrom(q);
      if (c) return c;
      if (!aiOn) throw new Error("GoogleマップでそのURLを開き、URLを貼ってください");
      try {
        const r = await sample.json(`日本の次の場所の緯度経度を、あなたの知識で推定してください。駅なら駅、住所なら住所の中心付近。特定できなければ lat と lng を null にしてください。\n返すJSON: {"lat": 数値, "lng": 数値}\n場所: ${q}`, { modelTier: "quick" });
        return r && r.lat != null && Number.isFinite(Number(r.lat)) ? { lat: Number(r.lat), lng: Number(r.lng), estimated: true } : null;
      } catch (e) {
        throw new Error(sampleError(e));
      }
    },
  };
}

artifactBackend().then((backend) => {
  document.getElementById("boot")?.remove();
  startApp(backend);
});

})();
</script>
