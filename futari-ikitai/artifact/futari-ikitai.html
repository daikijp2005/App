<title>Spotrip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
<style>
/* ふたりの行きたいリスト — 共通スタイル（Webアプリとアーティファクトの両方で使う）
   レイアウト: 上にヘッダーと追加欄、中央に1つのビュー、下にタブバー。詳細や設定は下からせり上がるシート */
:root {
  --bg: #fbf7f4;
  --surface: #ffffff;
  --surface-2: #f5ece8;
  --ink: #2a2124;
  --muted: #86777b;
  --line: #ece1dc;
  --rose: #df4a72;
  --rose-ink: #ffffff;
  --rose-soft: #fde7ed;
  --plan: #3b6fd8;
  --plan-soft: #e6eefc;
  --ok: #1d936a;
  --ok-soft: #dff3ea;
  --warn: #b86e05;
  --warn-soft: #fcf0da;
  --danger: #cf3442;
  --scrim: rgba(28, 16, 20, 0.45);
  --tint-amt: 100%;
  --shadow-sm: 0 1px 2px rgba(80, 40, 50, 0.06), 0 4px 14px rgba(80, 40, 50, 0.06);
  --shadow-lg: 0 18px 50px rgba(60, 25, 35, 0.18);
  --r-lg: 20px;
  --r-md: 14px;
  --display: "Zen Maru Gothic", "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", system-ui, sans-serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif;
  --nav-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17120f; --surface: #221b1d; --surface-2: #2d2427; --ink: #f5ecee; --muted: #ae9ea3; --line: #392e31;
    --rose: #ff6f93; --rose-ink: #2a0e16; --rose-soft: #47222d; --plan: #7ea4ff; --plan-soft: #1f2a44; --ok: #4fd2a0; --ok-soft: #173329;
    --warn: #f3b250; --warn-soft: #3a2c14; --danger: #ff6b76; --scrim: rgba(0, 0, 0, 0.6); --tint-amt: 18%;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 14px rgba(0, 0, 0, 0.25); --shadow-lg: 0 18px 50px rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17120f; --surface: #221b1d; --surface-2: #2d2427; --ink: #f5ecee; --muted: #ae9ea3; --line: #392e31;
  --rose: #ff6f93; --rose-ink: #2a0e16; --rose-soft: #47222d; --plan: #7ea4ff; --plan-soft: #1f2a44; --ok: #4fd2a0; --ok-soft: #173329;
  --warn: #f3b250; --warn-soft: #3a2c14; --danger: #ff6b76; --scrim: rgba(0, 0, 0, 0.6); --tint-amt: 18%;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 14px rgba(0, 0, 0, 0.25); --shadow-lg: 0 18px 50px rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--plan); }
img { display: block; max-width: 100%; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--rose); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; word-break: auto-phrase; margin: 0; }
.tour-slide p, .welcome p, .empty p { word-break: auto-phrase; }
.i { width: 20px; height: 20px; flex-shrink: 0; }
.i.sm { width: 16px; height: 16px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.sub { font-size: 12.5px; color: var(--muted); }

/* ---------- 骨組み ---------- */
.app { min-height: 100vh; padding-bottom: calc(var(--nav-h) + 24px + env(safe-area-inset-bottom, 0px)); }
.wrap { max-width: 1040px; margin: 0 auto; padding-inline: 16px; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px); }
.topbar .wrap { display: flex; align-items: center; gap: 10px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.brand svg { width: 32px; height: 32px; flex-shrink: 0; }
.brand h1 { font-size: 18px; font-weight: 900; letter-spacing: .01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.duo { display: flex; align-items: center; }
.av { width: 30px; height: 30px; border-radius: 50%; display: inline-grid; place-items: center; color: #fff; font-size: 12px; font-weight: 700; border: 2px solid var(--bg); flex-shrink: 0; overflow: hidden; background: var(--muted); }
.av img { width: 100%; height: 100%; object-fit: cover; }
.duo .av + .av { margin-left: -9px; }
.av.xs { width: 20px; height: 20px; font-size: 10px; border-width: 1.5px; }
.ghost-icon { border: 0; background: transparent; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: var(--ink); }
.ghost-icon:hover { background: var(--surface-2); }

/* 下のタブバー */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.nav .wrap { display: grid; grid-template-columns: repeat(5, 1fr); height: var(--nav-h); align-items: center; max-width: 560px; }
.nav button { border: 0; background: transparent; display: grid; justify-items: center; gap: 2px; font-size: 10.5px; font-weight: 700; color: var(--muted); padding: 6px 0; position: relative; }
.nav button.on { color: var(--rose); }
.nav .add { width: 52px; height: 52px; margin: -18px auto 0; border-radius: 18px; background: var(--rose); color: var(--rose-ink); box-shadow: 0 8px 22px color-mix(in srgb, var(--rose) 45%, transparent); display: grid; place-items: center; }
.nav .add .i { width: 26px; height: 26px; }
.dot { position: absolute; top: 2px; left: calc(50% + 6px); min-width: 17px; height: 17px; padding: 0 5px; border-radius: 999px; background: var(--rose); color: var(--rose-ink); font-size: 10px; line-height: 17px; font-weight: 800; }

/* ---------- 追加欄 ---------- */
.adder { margin: 6px 0 16px; display: flex; gap: 8px; background: var(--surface); border-radius: var(--r-lg); padding: 6px; box-shadow: var(--shadow-sm); align-items: center; }
.adder .i { margin-left: 10px; color: var(--muted); }
.adder input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 10px 4px; outline: none; }
.btn { border: 0; border-radius: 12px; padding: 10px 16px; font-weight: 700; background: var(--surface-2); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; justify-content: center; text-decoration: none; color: var(--ink); line-height: 1.3; }
.btn.rose { background: var(--rose); color: var(--rose-ink); }
.btn.plan { background: var(--plan); color: var(--surface); }
.btn.line { background: transparent; border: 1.5px solid var(--line); }
.btn.danger { background: transparent; color: var(--danger); border: 1.5px solid color-mix(in srgb, var(--danger) 40%, transparent); }
.btn.sm { padding: 7px 12px; font-size: 13px; border-radius: 10px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .5; cursor: default; }

/* ---------- ホーム ---------- */
.pulse { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 18px; }
.pulse button { border: 0; background: var(--surface); border-radius: var(--r-md); padding: 10px 4px 8px; box-shadow: var(--shadow-sm); text-align: center; }
.pulse b { display: block; font-family: var(--display); font-size: 24px; font-weight: 900; line-height: 1.15; font-variant-numeric: tabular-nums; }
.pulse span { font-size: 11px; color: var(--muted); }
.pulse .hot b { color: var(--rose); }

.section-h { display: flex; align-items: center; justify-content: space-between; gap: 8px 10px; margin: 20px 2px 10px; flex-wrap: wrap; }
.section-h h2 { white-space: nowrap; }
.section-h h2 { font-size: 17px; font-weight: 900; }
.section-h .sub a, .section-h button.link { font-size: 13px; color: var(--plan); background: none; border: 0; padding: 0; font-weight: 700; }

.rail { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding-inline: 16px; padding: 2px 16px 8px; margin-inline: -16px; scrollbar-width: none; }
.rail::-webkit-scrollbar, .chips::-webkit-scrollbar, .open-row::-webkit-scrollbar { display: none; }
.mini { flex: 0 0 min(72%, 250px); scroll-snap-align: start; border: 0; padding: 0; text-align: left; background: var(--surface); border-radius: var(--r-md); box-shadow: var(--shadow-sm); overflow: hidden; display: flex; min-width: 0; }
.mini .ph { width: 76px; flex-shrink: 0; display: grid; place-items: center; font-size: 30px; background: color-mix(in srgb, var(--tint, #eee) var(--tint-amt), var(--surface)); }
.mini .ph img { width: 100%; height: 100%; object-fit: cover; }
.mini .tx { padding: 9px 11px; min-width: 0; display: grid; gap: 2px; }
.mini b { font-size: 14px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--ink); white-space: nowrap; width: fit-content; }
.tag.open { background: var(--ok-soft); color: var(--ok); }
.tag.closed { background: var(--surface-2); color: var(--muted); }
.tag.closing, .tag.soon { background: var(--warn-soft); color: var(--warn); }
.tag.season { background: var(--rose-soft); color: var(--rose); }
.tag.plan { background: var(--plan-soft); color: var(--plan); }
.tag.done { background: var(--ok-soft); color: var(--ok); }
.tag.match { background: var(--rose); color: var(--rose-ink); }

.controls { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
.search { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 0 10px; }
.search .i { color: var(--muted); }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 9px 0; outline: none; }
.icon-btn { position: relative; border: 1.5px solid var(--line); background: var(--surface); height: 42px; min-width: 42px; padding: 0 10px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; font-weight: 700; }
.icon-btn .badge { position: absolute; top: -6px; right: -6px; background: var(--rose); color: var(--rose-ink); border-radius: 999px; font-size: 10px; min-width: 18px; height: 18px; line-height: 18px; padding: 0 5px; }
.seg { display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: transparent; border-radius: 9px; padding: 7px 12px; font-weight: 700; font-size: 13px; color: var(--muted); white-space: nowrap; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.08); }
.seg.full { display: grid; width: 100%; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 6px; scrollbar-width: none; }
.chips.wrap-chips { flex-wrap: wrap; overflow: visible; }
.chip { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13px; white-space: nowrap; display: inline-flex; gap: 5px; align-items: center; }
.chip.on { background: var(--rose-soft); border-color: var(--rose); font-weight: 700; }
.chip small { color: var(--muted); font-size: 11px; }

.group-h { display: flex; align-items: baseline; gap: 8px; margin: 18px 2px 10px; font-size: 15px; font-weight: 800; font-family: var(--display); }
.group-h small { color: var(--muted); font-weight: 500; font-family: var(--body); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.card { background: var(--surface); border-radius: var(--r-lg); overflow: hidden; box-shadow: var(--shadow-sm); cursor: pointer; display: flex; flex-direction: column; border: 0; padding: 0; text-align: left; transition: transform .18s ease, box-shadow .18s ease; min-width: 0; }
.card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.cover { position: relative; aspect-ratio: 4 / 3; max-width: 100%; display: grid; place-items: center; font-size: 46px; background: color-mix(in srgb, var(--tint, #eee) var(--tint-amt), var(--surface)); overflow: hidden; }
.cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.cover .tl, .cover .tr { position: absolute; top: 9px; display: flex; gap: 4px; flex-wrap: wrap; }
.cover .tl { left: 9px; } .cover .tr { right: 9px; }
.cover .glass { background: rgba(20, 12, 15, .55); color: #fff; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.card .body { padding: 11px 13px 12px; display: grid; gap: 6px; flex: 1; align-content: start; min-width: 0; }
.card h3 { font-size: 15.5px; font-weight: 800; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.facts { display: flex; flex-wrap: wrap; gap: 3px 12px; font-size: 12.5px; color: var(--muted); }
.facts span { display: inline-flex; align-items: center; gap: 3px; }
.facts b { color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }
.card-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 2px; gap: 6px; }
.who { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); min-width: 0; }
.who span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.heart { border: 0; background: transparent; padding: 4px; line-height: 0; color: var(--muted); border-radius: 50%; }
.heart.on { color: var(--rose); }
.heart.on svg { fill: currentColor; }

.empty { text-align: center; padding: 36px 16px; color: var(--muted); display: grid; gap: 8px; justify-items: center; }
.empty h3 { color: var(--ink); font-size: 17px; }
.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; margin-top: 10px; text-align: left; width: 100%; }
.step { background: var(--surface); border-radius: var(--r-md); padding: 14px; box-shadow: var(--shadow-sm); color: var(--ink); font-size: 14px; display: grid; gap: 4px; }
.step i { font-style: normal; font-family: var(--display); font-weight: 900; color: var(--rose); font-size: 13px; }

/* ---------- 答え合わせ（スワイプ） ---------- */
.swipe-stage { position: relative; height: min(64vh, 520px); margin: 8px auto 0; max-width: 420px; }
.swipe-card { position: absolute; inset: 0; background: var(--surface); border-radius: 26px; box-shadow: var(--shadow-lg); overflow: hidden; display: flex; flex-direction: column; touch-action: pan-y; user-select: none; transition: transform .25s ease, opacity .25s ease; }
.swipe-card.dragging { transition: none; }
.swipe-card.behind { transform: scale(.95) translateY(14px); opacity: .7; pointer-events: none; }
.swipe-card .cover { aspect-ratio: auto; flex: 1; font-size: 80px; }
.swipe-card .body { padding: 16px 18px 18px; display: grid; gap: 8px; }
.swipe-card h3 { font-size: 21px; font-weight: 900; line-height: 1.35; }
.stamp { position: absolute; top: 22px; padding: 6px 14px; border: 3px solid; border-radius: 12px; font-family: var(--display); font-size: 22px; font-weight: 900; opacity: 0; transform: rotate(-12deg); background: var(--surface); }
.stamp.yes { left: 18px; color: var(--rose); }
.stamp.no { right: 18px; color: var(--muted); transform: rotate(12deg); }
.swipe-actions { display: flex; justify-content: center; gap: 22px; margin: 18px 0 6px; }
.round { width: 64px; height: 64px; border-radius: 50%; border: 0; background: var(--surface); box-shadow: var(--shadow-sm); display: grid; place-items: center; color: var(--muted); }
.round.yes { width: 74px; height: 74px; background: var(--rose); color: var(--rose-ink); box-shadow: 0 10px 26px color-mix(in srgb, var(--rose) 40%, transparent); }
.round.yes .i { width: 32px; height: 32px; fill: currentColor; }
.round .i { width: 26px; height: 26px; }
.round.skip { width: 48px; height: 48px; align-self: center; }

.match-overlay { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; background: color-mix(in srgb, var(--rose) 88%, black); color: #fff; text-align: center; padding: 24px; animation: fade .2s ease; overflow: hidden; }
.match-overlay h2 { font-size: 40px; font-weight: 900; letter-spacing: .04em; }
.match-overlay p { opacity: .92; margin: 6px 0 22px; }
.match-overlay .btn { background: #fff; color: var(--rose); }
.match-overlay .btn.line { background: transparent; color: #fff; border-color: rgba(255,255,255,.6); }
.float-heart { position: absolute; bottom: -40px; font-size: 28px; animation: rise 2.6s ease-in forwards; opacity: .9; }
@keyframes rise { to { transform: translateY(-115vh) rotate(25deg); opacity: 0; } }

/* ---------- プラン ---------- */
.panel { background: var(--surface); border-radius: var(--r-lg); padding: 16px; box-shadow: var(--shadow-sm); }
.panel + .panel { margin-top: 12px; }
.course { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow-sm); overflow: hidden; margin-top: 14px; }
.course-head { padding: 14px 16px 6px; display: grid; gap: 4px; }
.course-head h3 { font-size: 17px; font-weight: 900; }
.course-stats { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.course-stats b { color: var(--ink); font-variant-numeric: tabular-nums; }
.tl { list-style: none; margin: 0; padding: 8px 16px 4px; }
.tl li { display: grid; grid-template-columns: 48px 1fr; gap: 10px; }
.tl .time { font-family: var(--display); font-weight: 900; font-size: 14px; padding-top: 10px; font-variant-numeric: tabular-nums; }
.tl .stop { border-left: 2px solid var(--line); padding: 8px 0 10px 14px; position: relative; min-width: 0; }
.tl .stop::before { content: ""; position: absolute; left: -7px; top: 15px; width: 12px; height: 12px; border-radius: 50%; background: var(--rose); border: 2px solid var(--surface); }
.tl .stop button { border: 0; background: none; padding: 0; text-align: left; font-weight: 800; font-size: 15px; }
.tl .leg { grid-column: 2; font-size: 12px; color: var(--muted); padding: 0 0 0 16px; border-left: 2px dashed var(--line); display: flex; align-items: center; gap: 4px; }
.course .actions { padding: 10px 16px 16px; }

/* ---------- 思い出 ---------- */
.stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stats3 div { background: var(--surface); border-radius: var(--r-md); padding: 12px 6px; text-align: center; box-shadow: var(--shadow-sm); }
.stats3 b { display: block; font-family: var(--display); font-size: 26px; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1.2; }
.stats3 span { font-size: 11px; color: var(--muted); }
.japan { display: grid; grid-template-columns: repeat(13, 1fr); grid-template-rows: repeat(13, auto); gap: 3px; max-width: 520px; margin: 0 auto; }
.pref { aspect-ratio: 1; border-radius: 6px; background: var(--surface-2); display: grid; place-items: center; font-size: clamp(7px, 1.9vw, 10px); color: var(--muted); font-weight: 700; position: relative; }
.pref.want { box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--rose) 60%, transparent); color: var(--ink); }
.pref.v1 { background: color-mix(in srgb, var(--ok) 35%, var(--surface)); color: var(--ink); }
.pref.v2 { background: color-mix(in srgb, var(--ok) 65%, var(--surface)); color: var(--ink); }
.pref.v3 { background: var(--ok); color: var(--surface); }
.legend { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); margin-top: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.bars { display: grid; gap: 8px; }
.bar-row > span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-row { display: grid; grid-template-columns: 124px 1fr 28px; gap: 8px; align-items: center; font-size: 13px; }
.bar-track { height: 10px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--rose); border-radius: 999px; }
.memory { display: grid; grid-template-columns: 56px 1fr; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.memory:last-child { border-bottom: 0; }
.memory .ph { width: 56px; height: 56px; border-radius: 14px; display: grid; place-items: center; font-size: 26px; background: color-mix(in srgb, var(--tint, #eee) var(--tint-amt), var(--surface)); overflow: hidden; }
.memory .ph img { width: 100%; height: 100%; object-fit: cover; }
.stars-ro { color: var(--warn); letter-spacing: 1px; font-size: 13px; }

/* ---------- シート ---------- */
.overlay { position: fixed; inset: 0; background: var(--scrim); z-index: 60; display: flex; align-items: flex-end; justify-content: center; animation: fade .16s ease; }
.sheet { background: var(--bg); width: 100%; max-width: 640px; max-height: 94vh; overflow-y: auto; overscroll-behavior: contain; border-radius: 24px 24px 0 0; padding: 0 16px calc(24px + env(safe-area-inset-bottom, 0px)); animation: up .22s cubic-bezier(.2, .8, .3, 1); }
.overlay.instant, .overlay.instant .sheet { animation: none; }
@media (min-width: 720px) { .overlay { align-items: center; } .sheet { border-radius: 24px; max-height: 88vh; } }
@keyframes fade { from { opacity: 0; } }
@keyframes up { from { transform: translateY(40px); } }
.grab { width: 40px; height: 5px; border-radius: 99px; background: var(--line); margin: 8px auto 4px; }
.sheet-h { position: sticky; top: 0; z-index: 2; background: var(--bg); display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 0 10px; }
.sheet-h h2 { font-size: 19px; font-weight: 900; }
.x { border: 0; background: var(--surface-2); width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0; }
.hero { position: relative; border-radius: var(--r-lg); overflow: hidden; height: 190px; display: grid; place-items: center; font-size: 64px; background: color-mix(in srgb, var(--tint, #eee) var(--tint-amt), var(--surface)); margin-bottom: 14px; }
.hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.d-title { font-size: 23px; font-weight: 900; line-height: 1.35; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 2px; }
.open-row { display: flex; gap: 8px; overflow-x: auto; padding: 14px 16px 4px; margin-inline: -16px; scrollbar-width: none; }
.open-btn { flex: 0 0 auto; display: grid; justify-items: center; gap: 5px; width: 74px; text-decoration: none; color: var(--ink); font-size: 11.5px; font-weight: 700; text-align: center; line-height: 1.25; border: 0; background: none; padding: 0; }
.open-btn .ic { width: 50px; height: 50px; border-radius: 16px; display: grid; place-items: center; background: var(--surface); box-shadow: var(--shadow-sm); color: var(--ink); }
.open-btn.primary .ic { background: var(--rose); color: var(--rose-ink); }
.open-btn small { display: block; font-weight: 500; color: var(--muted); font-size: 10px; }
.vote-row { display: grid; gap: 8px; }
.vote { display: flex; align-items: center; gap: 10px; background: var(--surface); border-radius: var(--r-md); padding: 8px 10px; }
.vote .name { flex: 1; font-weight: 700; font-size: 14px; min-width: 0; }
.info { background: var(--surface); border-radius: var(--r-md); padding: 2px 14px; margin: 12px 0; }
.info-row { display: flex; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 14px; align-items: flex-start; }
.info-row:last-child { border-bottom: 0; }
.info-row > .i { margin-top: 2px; color: var(--muted); }
.info-row .val { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.travel { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 2px; }
.travel span { display: inline-flex; gap: 4px; align-items: baseline; }
.travel b { font-size: 16px; font-family: var(--display); font-variant-numeric: tabular-nums; }
.caption { white-space: pre-wrap; font-size: 13px; color: var(--muted); max-height: 180px; overflow: auto; background: var(--surface); border-radius: 12px; padding: 10px 12px; overflow-wrap: anywhere; margin-top: 6px; }
.label { font-size: 12px; font-weight: 800; color: var(--muted); margin: 18px 0 8px; letter-spacing: .08em; }
.stars { display: flex; gap: 2px; }
.stars button { border: 0; background: transparent; font-size: 26px; padding: 0 2px; color: var(--line); line-height: 1; }
.stars button.on { color: var(--warn); }
.field { display: grid; gap: 5px; margin-bottom: 12px; min-width: 0; }
.field > label { font-size: 12px; font-weight: 700; color: var(--muted); }
.field input, .field select, .field textarea { border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--surface); width: 100%; min-width: 0; }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--rose); }
.field textarea { min-height: 84px; resize: vertical; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.comments { display: grid; gap: 8px; }
.comment { display: flex; gap: 8px; align-items: flex-end; }
.bubble { background: var(--surface); border-radius: 16px 16px 16px 4px; padding: 8px 12px; font-size: 14px; overflow-wrap: anywhere; min-width: 0; max-width: 80%; }
.comment.mine { flex-direction: row-reverse; }
.comment.mine .bubble { background: var(--rose-soft); border-radius: 16px 16px 4px 16px; }
.bubble time { font-size: 10px; color: var(--muted); display: block; margin-top: 2px; }
.composer { display: flex; gap: 6px; margin-top: 10px; }
.composer input { flex: 1; min-width: 0; border: 1.5px solid var(--line); border-radius: 12px; padding: 9px 12px; background: var(--surface); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.actions .btn { flex: 1; }
.notice { background: var(--surface-2); padding: 11px 13px; border-radius: 12px; font-size: 13px; margin-bottom: 12px; }
.notice.warn { background: var(--warn-soft); }
.notice.ok { background: var(--ok-soft); }
.base-item { display: flex; align-items: center; gap: 10px; background: var(--surface); border-radius: 12px; padding: 10px 12px; margin-bottom: 6px; }
.base-item .val { flex: 1; min-width: 0; }
.thinking { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
.spinner { width: 18px; height: 18px; border: 2.5px solid var(--rose-soft); border-top-color: var(--rose); border-radius: 50%; animation: spin .8s linear infinite; flex-shrink: 0; }
@keyframes spin { to { transform: rotate(360deg); } }
.drop { border: 1.5px dashed var(--line); border-radius: 14px; padding: 12px; display: flex; gap: 10px; align-items: center; font-size: 13px; color: var(--muted); cursor: pointer; }
.dice { font-size: 50px; text-align: center; line-height: 1.2; }
.dice.rolling { animation: spin .45s linear infinite; }
.slot { font-family: var(--display); font-size: 21px; font-weight: 900; min-height: 60px; display: grid; place-items: center; text-align: center; padding: 0 10px; }
#map { height: min(62vh, 560px); border-radius: var(--r-lg); box-shadow: var(--shadow-sm); z-index: 0; }
.pin { width: 34px; height: 34px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); display: grid; place-items: center; box-shadow: 0 3px 8px rgba(0,0,0,.3); border: 2px solid #fff; }
.pin span { transform: rotate(45deg); font-size: 16px; }

#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 18px + env(safe-area-inset-bottom, 0px)); z-index: 95; display: grid; gap: 6px; justify-items: center; width: max-content; max-width: calc(100vw - 32px); pointer-events: none; }
.toast { background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 18px; text-align: center; font-size: 14px; font-weight: 700; box-shadow: var(--shadow-lg); animation: up .2s ease; }

/* ---------- ようこそ（Webアプリ） ---------- */
.welcome { max-width: 480px; margin: 0 auto; padding: 48px 20px; text-align: center; }
.welcome svg.logo { width: 76px; height: 76px; margin: 0 auto 14px; display: block; }
.welcome h1 { font-size: 27px; font-weight: 900; margin-bottom: 8px; }
.welcome p { color: var(--muted); }
.welcome form { background: var(--surface); padding: 18px; border-radius: var(--r-lg); box-shadow: var(--shadow-sm); text-align: left; margin-top: 22px; }
.features { text-align: left; display: grid; gap: 8px; margin: 22px 0 0; padding: 0; list-style: none; font-size: 14px; }
.features li { background: var(--surface); border-radius: 12px; padding: 11px 13px; }
.pick-me { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pick-me button { border: 2px solid var(--line); background: var(--surface); border-radius: 18px; padding: 20px 8px; font-weight: 800; display: grid; justify-items: center; gap: 8px; }
.pick-me .av { width: 52px; height: 52px; font-size: 20px; }


/* ---------- 使い方スライド ---------- */
.tour { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: grid; grid-template-rows: auto 1fr auto; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); animation: fade .2s ease; }
.tour-top { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; max-width: 560px; width: 100%; margin: 0 auto; }
.tour-top .brand { display: flex; align-items: center; gap: 8px; font-family: var(--display); }
.tour-top .brand svg { width: 28px; height: 28px; }
.tour-track { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; outline: none; }
.tour-track::-webkit-scrollbar { display: none; }
.tour-slide { flex: 0 0 100%; scroll-snap-align: center; display: grid; align-content: center; justify-items: center; gap: 14px; padding: 8px 28px; text-align: center; }
.tour-slide h2 { font-size: 24px; font-weight: 900; line-height: 1.35; max-width: 20ch; }
.tour-slide p { color: var(--muted); max-width: 32ch; margin: 0; font-size: 15px; }
.tour-mock { width: min(100%, 320px); min-height: 230px; background: var(--surface-2); border-radius: 28px; padding: 22px 18px; display: grid; align-content: center; margin-bottom: 8px; text-align: left; overflow: hidden; }
.tour-bottom { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 20px 22px; max-width: 560px; width: 100%; margin: 0 auto; }
.tour-bottom .btn { min-width: 132px; padding: 13px 20px; font-size: 15px; }
.tour-dots { display: flex; gap: 7px; }
.tour-dots button { width: 8px; height: 8px; padding: 0; border: 0; border-radius: 99px; background: var(--line); transition: width .2s ease, background .2s ease; }
.tour-dots button.on { width: 24px; background: var(--rose); }

/* ---------- 誰と使う？ ---------- */
.type-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.type-grid.compact { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.type-tile { border: 2px solid var(--line); background: var(--surface); border-radius: 16px; padding: 14px 10px; display: grid; justify-items: center; gap: 4px; text-align: center; font-weight: 700; font-size: 14px; color: var(--ink); }
.type-grid.compact .type-tile { padding: 10px 6px; font-size: 12.5px; }
.type-tile .emoji { font-size: 28px; line-height: 1.1; }
.type-grid.compact .type-tile .emoji { font-size: 22px; }
.type-tile small { font-weight: 500; color: var(--muted); font-size: 11.5px; line-height: 1.4; }
.type-tile.on, button.type-tile:hover { border-color: var(--rose); background: var(--rose-soft); }
.steps-bar { display: flex; gap: 6px; justify-content: center; margin-bottom: 16px; }
.steps-bar i { width: 28px; height: 4px; border-radius: 99px; background: var(--line); }
.steps-bar i.on { background: var(--rose); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}
@media (max-width: 520px) {
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .card h3 { font-size: 14px; }
  .card .body { padding: 9px 10px 10px; }
  .facts { font-size: 11.5px; gap: 2px 8px; }
  .who span { display: none; }
  .cover { font-size: 38px; }
  .pulse b { font-size: 21px; }
  .row2 { grid-template-columns: 1fr; }
  .bar-row { grid-template-columns: 112px 1fr 24px; }
  .pulse span { font-size: 10.5px; }
}
/* シートを開いているときは、通知を上に出してボタンと重ならないようにする */
body:has(.overlay) #toast { bottom: auto; top: calc(14px + env(safe-area-inset-top, 0px)); }
.search-info { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 4px 2px 6px; }
.search-info .btn { margin-left: auto; }
.brand-line { display: grid; gap: 2px; margin: -4px 0 18px; color: var(--muted); font-size: 13px; }
.brand-line b { font-family: var(--display); font-size: 22px; font-weight: 900; color: var(--rose); letter-spacing: .06em; }

/* ---------- 自分で選んだメインカラー ---------- */
:root[style*="--user-accent"] { --rose: var(--user-accent); --rose-ink: var(--user-accent-ink); --rose-soft: color-mix(in srgb, var(--user-accent) 15%, var(--surface)); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"])[style*="--user-accent"] { --rose: color-mix(in srgb, var(--user-accent) 72%, white); --rose-ink: #1d1416; --rose-soft: color-mix(in srgb, var(--user-accent) 28%, var(--surface)); }
}
:root[data-theme="dark"][style*="--user-accent"] { --rose: color-mix(in srgb, var(--user-accent) 72%, white); --rose-ink: #1d1416; --rose-soft: color-mix(in srgb, var(--user-accent) 28%, var(--surface)); }
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 10px; }
.swatch { border: 0; background: none; padding: 0; display: grid; justify-items: center; gap: 4px; cursor: pointer; color: var(--ink); }
.swatch i { width: 40px; height: 40px; border-radius: 50%; background: var(--sw); box-shadow: inset 0 0 0 2px rgba(255,255,255,.35); }
.swatch.on i { outline: 3px solid var(--sw); outline-offset: 3px; }
.swatch small { font-size: 11px; color: var(--muted); }
.swatch.custom input { width: 40px; height: 40px; border: 0; padding: 0; border-radius: 50%; overflow: hidden; background: conic-gradient(red, yellow, lime, cyan, blue, magenta, red); cursor: pointer; }
.swatch.custom input::-webkit-color-swatch-wrapper { padding: 0; }
.swatch.custom input::-webkit-color-swatch { border: 0; border-radius: 50%; }

/* ---------- ジャンルの色 ---------- */
.tag.genre { background: var(--tint); color: #2a2124; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.genre-row { margin: 2px 0 4px; }
.g-chip i { width: 10px; height: 10px; border-radius: 50%; background: var(--tint); box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }
.g-chip.on { background: color-mix(in srgb, var(--tint) 70%, var(--surface)); border-color: color-mix(in srgb, var(--tint) 60%, var(--ink)); color: var(--ink); }

/* ---------- アイコン ---------- */
.av.is-emoji { background: var(--surface-2) !important; }
.av .emo { font-size: 1.15em; line-height: 1; }
.av.lg { width: 56px; height: 56px; font-size: 22px; border-width: 0; }
.av.lg .emo { font-size: 30px; }
.emoji-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
.emoji-grid button { aspect-ratio: 1; border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; font-size: 22px; padding: 0; }
.emoji-grid button:hover { border-color: var(--rose); }
@media (max-width: 420px) { .emoji-grid { grid-template-columns: repeat(6, 1fr); } }

/* ---------- メンバー図鑑 ---------- */
.best-combo { display: grid; justify-items: center; gap: 4px; padding: 16px; margin-bottom: 12px; border-radius: var(--r-lg); background: linear-gradient(135deg, var(--rose-soft), var(--surface)); text-align: center; }
.best-combo .duo .av { width: 44px; height: 44px; font-size: 18px; }
.best-combo b { font-family: var(--display); font-size: 18px; }
.best-combo .num { color: var(--rose); font-weight: 800; }
.member-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.member-card { background: var(--surface); border-radius: var(--r-lg); padding: 14px; box-shadow: var(--shadow-sm); display: grid; gap: 10px; min-width: 0; }
.mc-top { display: flex; gap: 12px; align-items: center; }
.mc-name { font-family: var(--display); font-size: 18px; font-weight: 900; }
.tag.title { background: var(--rose-soft); color: var(--rose); }
.mc-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; text-align: center; }
.mc-stats span { background: var(--surface-2); border-radius: 12px; padding: 6px 4px; font-size: 11px; color: var(--muted); display: grid; }
.mc-stats b { font-family: var(--display); font-size: 18px; color: var(--ink); }
.compat { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 8px; align-items: center; }
.compat > .sub:last-child { grid-column: 1 / -1; }
.meter { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--rose-soft), var(--rose)); }
.compat b { color: var(--rose); }

/* ---------- カレンダー ---------- */
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.cal-head h2 { font-size: 18px; font-weight: 900; }
.cal-head .ghost-icon { font-size: 24px; line-height: 1; }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal-w { text-align: center; font-size: 11px; font-weight: 700; color: var(--muted); padding-bottom: 2px; }
.cal-w.sun, .cal-d.sun .n { color: var(--danger); }
.cal-w.sat, .cal-d.sat .n { color: var(--plan); }
.cal-d { border: 0; background: var(--bg); border-radius: 12px; min-height: 58px; padding: 5px 2px 4px; display: grid; grid-template-rows: auto 1fr auto; justify-items: center; gap: 1px; color: var(--ink); }
.cal-d .n { font-size: 13px; font-weight: 700; width: 24px; height: 24px; display: grid; place-items: center; border-radius: 50%; }
.cal-d.today .n { background: var(--rose); color: var(--rose-ink) !important; }
.cal-d.on { box-shadow: inset 0 0 0 2px var(--rose); background: var(--rose-soft); }
.cal-d .mk { font-size: 15px; line-height: 1.1; letter-spacing: -2px; }
.cal-d .dots { display: flex; gap: 3px; min-height: 6px; }
.cal-d .dots i { width: 6px; height: 6px; border-radius: 50%; }
.cal-d .dots .p { background: var(--plan); } .cal-d .dots .d { background: var(--warn); } .cal-d .dots .v { background: var(--ok); }
.pick { position: relative; }
.pick .check { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); }
.pick.on { box-shadow: 0 0 0 2px var(--rose); }
.pick.on .check { background: var(--rose); border-color: var(--rose); }
.pick.on .check::after { content: "✓"; color: var(--rose-ink); font-size: 14px; font-weight: 900; display: grid; place-items: center; height: 100%; }
@media (max-width: 420px) { .cal-d { min-height: 50px; } .cal-d .mk { font-size: 13px; } }

/* ---------- まとめて入力 ---------- */
.bulk { background: var(--surface); border: 1.5px dashed color-mix(in srgb, var(--rose) 45%, var(--line)); border-radius: var(--r-lg); padding: 12px; margin-bottom: 14px; display: grid; gap: 8px; }
.bulk label { display: grid; gap: 2px; }
.bulk label b { font-family: var(--display); font-size: 15px; }
.bulk textarea { border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--bg); width: 100%; resize: vertical; line-height: 1.7; font-size: 15px; }
.bulk textarea:focus { outline: none; border-color: var(--rose); }
.bulk-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.bulk-foot .sub { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; min-width: 0; }
.bulk-btns { display: flex; gap: 6px; }
.bulk-wrap { margin-bottom: 8px; }
.field .autofilled { animation: autofill 1.4s ease; border-color: color-mix(in srgb, var(--rose) 55%, var(--line)); }
@keyframes autofill { 0% { background: var(--rose-soft); } 100% { background: var(--surface); } }

/* ---------- 移動手段 ---------- */
.mode-group { display: grid; gap: 6px; margin-top: 10px; }
.mode-h { font-size: 11px; font-weight: 800; color: var(--muted); letter-spacing: .08em; }
.mode { border: 1.5px solid var(--line); border-radius: 14px; background: var(--bg); overflow: hidden; }
.mode.open { border-color: color-mix(in srgb, var(--rose) 45%, var(--line)); }
.mode-row { width: 100%; border: 0; background: none; display: grid; grid-template-columns: 20px 1fr auto auto 16px; gap: 8px; align-items: center; padding: 10px 12px; text-align: left; color: var(--ink); }
.mode-row .mode-name { font-weight: 700; font-size: 14px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.mode-row b { font-family: var(--display); font-size: 15px; }
.mode-fare { font-size: 12px; color: var(--muted); min-width: 64px; text-align: right; }
.mode-row > .i:last-child { transition: transform .2s ease; color: var(--muted); }
.mode.open .mode-row > .i:last-child { transform: rotate(180deg); }
.mode-detail { padding: 0 12px 12px; }
.steps-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.steps-list li { display: grid; grid-template-columns: 20px 1fr auto; gap: 8px; align-items: start; padding: 7px 0 7px 2px; border-left: 2px dashed var(--line); margin-left: 8px; padding-left: 12px; font-size: 13.5px; position: relative; }
.steps-list li > .i { position: absolute; left: -11px; top: 7px; background: var(--bg); color: var(--rose); width: 20px; height: 20px; padding: 2px; border-radius: 50%; }
.steps-list li > span:nth-child(2) { grid-column: 1 / 3; padding-left: 10px; }
.steps-list li > .num { color: var(--muted); font-size: 12px; white-space: nowrap; }
.ai-route { margin-top: 10px; padding: 10px 12px; border-radius: 12px; background: var(--surface); display: grid; gap: 6px; }
.ai-route > b { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--rose); }
@media (max-width: 420px) { .mode-row { grid-template-columns: 18px 1fr auto 14px; row-gap: 0; } .mode-row b { grid-column: 3; grid-row: 1; } .mode-row > .i:last-child { grid-column: 4; grid-row: 1; } .mode-fare { grid-column: 2; grid-row: 2; text-align: left; min-width: 0; } }

/* ---------- まあまあ ---------- */
.meh-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.meh-grid button { border: 1.5px solid var(--line); background: var(--surface); border-radius: 14px; padding: 12px 10px; display: flex; gap: 8px; align-items: center; font-weight: 700; font-size: 14px; color: var(--ink); text-align: left; }
.meh-grid button span { font-size: 20px; }
.meh-grid button:hover { border-color: var(--rose); background: var(--rose-soft); }
.kind-box { margin-top: 10px; padding: 12px 14px; border-radius: 14px; background: linear-gradient(135deg, var(--ok-soft), var(--surface)); display: grid; gap: 4px; font-size: 13.5px; }

function classifyGenre(text) {
  const lower = text.toLowerCase();
  let best = { id: "other", score: 0 };
  for (const g of GENRES) {
    let score = 0;
    // 長い語から順に見て、同じ箇所を二重に数えない（「パンケーキ」と「ケーキ」など）
    const used = new Set();
    for (const w of [...g.words].sort((a, b) => b.length - a.length)) {
      const wl = w.toLowerCase();
      let idx = lower.indexOf(wl);
      while (idx !== -1) {
        if (!used.has(idx)) {

          score += /[#＃]/.test(token + lower[idx - 1]) ? 2 : 1;
        }
        idx = lower.indexOf(wl, idx + wl.length);
      }
    }
    if (score > best.score) best = { id: g.id, score };
  }
  return best.id;

function extractPrice(text) {
  if (/(入場|参加|拝観|入館)?無料|free\s*entry|入場料なし/i.test(text) && !/[¥￥]\s*[1-9]|[1-9][0-9,]*\s*円/.test(text)) {
    return { priceMin: 0, priceMax: 0, priceNote: "無料" };

  const values = [];
  const re = /(?:[¥￥]\s*([0-9０-９][0-9０-９,，]*))|(?:([0-9０-９][0-9０-９,，]*)\s*(?:円|yen))|(?:([0-9０-９]+(?:\.[0-9]+)?)\s*万円)/gi;

    if (Number.isFinite(v) && v >= 50 && v <= 300000) values.push(v);

// 住所の直後に「 2F」「 ○○ビル3階」のような建物名が続いていればつなげる
function withBuilding(text, end, address) {
  const m = text.slice(end).match(/^[ 　]?([^\s、。,，\n#]{0,24}(?:ビル|階|[0-9０-９]F|号室|号館|館|タワー|プラザ|ハウス|マンション|ヒルズ|テラス)[^\s、。,，\n#]{0,6})/);
  return m ? `${address} ${m[1]}` : address;
}

// 住所から郵便番号と都道府県を外した残り（市区町村〜番地・建物名）
function cityFromAddress(address, prefecture = "") {
  let a = String(address || "").replace(/^〒?\s*\d{3}-?\d{4}\s*/, "").trim();
  const pref = prefecture || PREF_LIST.find((p) => a.startsWith(p)) || "";
  if (pref && a.startsWith(pref)) a = a.slice(pref.length);
  return a.trim().slice(0, 120);
}

// 一覧やエリア分けで使う短い市区町村名（「渋谷区神宮前4-12-10」→「渋谷区」）
function cityShort(city) {
  const c = String(city || "");
  return (c.match(/^.*?[市区町村]/) || [c])[0];
}

function extractPlace(text) {
  const address = (() => {
    const labeled = pickLabeledLine(text, ["住所", "所在地", "Address", "address", "アクセス"]);
    if (labeled && new RegExp(PREFS + "|[市区町村]").test(labeled)) {
      // 「住所：〇〇 嵐山駅から徒歩7分」のように後ろに続く文は切り、建物名だけはつなげる
      const first = labeled.replace(/^〒?\s*\d{3}-?\d{4}[\s　]*/, "").split(/[\s　]/)[0];
      const at = text.indexOf(first);
      return at >= 0 ? withBuilding(text, at + first.length, first) : first;
    }
    const m = text.match(new RegExp(`(?:〒?\\s*\\d{3}-?\\d{4}\\s*)?(?:${PREFS})[^\\s　、。,，\\n#]{2,40}`));
    if (m) return withBuilding(text, m.index + m[0].length, m[0].trim());
    return "";
  })();

  const pin = pickLabeledLine(text, ["📍", "📌", "🏠", "🗺️?", "場所", "店名", "店舗名", "スポット名", "施設名"]);

  let prefecture = "";
  for (const p of PREF_LIST) {
    if ((address + " " + pin + " " + text).includes(p)) { prefecture = p; break; }
  }
  // 市区町村は、住所があれば都道府県より後ろを番地・建物名まで全部入れる
  let city = address ? cityFromAddress(address, prefecture) : "";
  if (!city) {
    const cityMatch = (pin || text).match(/(?:都|道|府|県)?([^\s　、。,，\n#📍都道府県]{1,6}?(?:市|区|町|村))/);
    if (cityMatch) city = cityMatch[1];
  }

  // 「駅 1200円」の数字を徒歩分と読まないよう、「徒歩」か「分」がついた数字だけを拾う
  const stationMatch = text.match(/([^\s　、。,，\n#「」【】()（）📍・]{1,10}駅)(?:から|より)?\s*(?:(?:徒歩|歩いて)\s*([0-9０-９]+)|([0-9０-９]+)\s*分)?/);
  const station = stationMatch ? stationMatch[1] : "";
  const walkRaw = stationMatch && (stationMatch[2] || stationMatch[3]);
  const walkMin = walkRaw ? toNumber(walkRaw) : null;

  // 📍の行が住所そのものならそれを住所、そうでなければ店名として扱う
  let placeName = "";
  if (pin && !new RegExp(`^(?:${PREFS})`).test(pin)) placeName = pin.replace(/[(（].*$/, "").trim();
  if (!placeName) {
    const bracket = text.match(/[【「『]([^】」』\n]{2,30})[】」』]/);
    if (bracket) placeName = bracket[1].trim();
  }

  return {
    placeName: placeName.slice(0, 60),
    address: (address || (pin && new RegExp(`^(?:${PREFS})`).test(pin) ? pin : "")).slice(0, 120),
    prefecture,
    city,
    station,
    walkMin,
  };
}

const TIME_RANGE = /\d{1,2}(?:[:：]\d{2}|時(?:\d{1,2}分?)?)\s*[〜~～\-－ー―]\s*(?:翌)?\d{1,2}(?:[:：]\d{2}|時(?:\d{1,2}分?)?)/;

function extractHours(text) {
  // 「営業時間 11:00〜20:00」のようなラベル付きを優先し、なければ時刻の範囲そのものを拾う
  let hours = pickLabeledLine(text, ["営業時間", "OPEN", "Open", "open", "時間", "⏰", "🕐"]);
  if (!hours || !TIME_RANGE.test(hours)) hours = (text.match(TIME_RANGE) || [hours || ""])[0];
  // 「火曜休み」「水・木曜定休」「定休日：月曜」
  let closed = "";
  const strict = text.match(/((?:毎週)?[月火水木金土日](?:曜日?|曜)?(?:[・、,と][月火水木金土日](?:曜日?|曜)?)*)\s*(?:定休日?|休み|休業|休館|お休み)/);
  if (strict) closed = strict[1];
  else if (/不定休|年中無休|無休/.test(text)) closed = text.match(/不定休|年中無休|無休/)[0];
  else closed = pickLabeledLine(text, ["定休日", "CLOSE", "Closed"]);
  return { hours: String(hours || "").slice(0, 60), closed: String(closed || "").slice(0, 40) };
}

function extractTags(text) {
  const tags = new Set();
  const re = /[#＃]([^\s#＃,，、。!！?？"“”'「」]+)/g;
  let m;
  while ((m = re.exec(text)) && tags.size < 15) tags.add(m[1]);
  return [...tags];
}

function analyzeText(text) {
  const t = String(text || "");
  return {
    genre: classifyGenre(t),
    ...extractPrice(t),
    ...extractPlace(t),
    ...extractHours(t),
    tags: extractTags(t),
  };
}

function detectPlatform(url) {
  let host = "";
  try { host = new URL(url).hostname.replace(/^www\.|^m\./, ""); } catch { return "web"; }
  if (/instagram\.com$/.test(host)) return "instagram";
  if (/tiktok\.com$/.test(host)) return "tiktok";
  if (/(^|\.)x\.com$|twitter\.com$/.test(host)) return "x";
  if (/youtube\.com$|youtu\.be$/.test(host)) return "youtube";
  if (/threads\.(net|com)$/.test(host)) return "threads";
  if (/tabelog\.com$/.test(host)) return "tabelog";
  if (/maps\.app\.goo\.gl$|google\.[a-z.]+$|goo\.gl$/.test(host)) return "googlemaps";
  if (/lemon8-app\.com$/.test(host)) return "lemon8";
  if (/facebook\.com$|fb\.watch$/.test(host)) return "facebook";
  return "web";
}

function normalizeUrl(raw) {
  const m = String(raw || "").match(/https?:\/\/[^\s<>"'「」]+/);
  if (!m) return "";
  try {
    const u = new URL(m[0]);
    // 追跡用パラメータは重複判定の邪魔なので落とす
    for (const k of [...u.searchParams.keys()]) {
      if (/^(utm_|igsh|igshid|si$|is_from_webapp|sender_device|_r$|_t$|s$|t$|ref)/.test(k)) u.searchParams.delete(k);
    }
    u.hash = "";
    return u.toString().replace(/\?$/, "");
  } catch {
    return "";
  }
}

// ---------- まとめて入力（手入力のメモ書きから項目を埋める） ----------
// 「10/31まで」「11月3日まで」「〜2026/12/25」→ YYYY-MM-DD。年がなければ、過ぎていれば来年とみなす
function extractDeadline(text, now = new Date()) {
  const t = String(text || "").replace(/[０-９]/g, (d) => String.fromCharCode(d.charCodeAt(0) - 0xfee0));
  const m = t.match(/(?:[〜~～]\s*)?(?:(\d{4})\s*[\/年.\-]\s*)?(\d{1,2})\s*[\/月.\-]\s*(\d{1,2})\s*日?\s*(?:\([^)]*\)|（[^）]*）)?\s*(まで|迄|〆|終了|までの|限定)/)
    || t.match(/[〜~～]\s*(?:(\d{4})\s*[\/年.\-]\s*)?(\d{1,2})\s*[\/月.\-]\s*(\d{1,2})\s*日?/);
  if (!m) return "";
  const mo = Number(m[2]), d = Number(m[3]);
  if (mo < 1 || mo > 12 || d < 1 || d > 31) return "";
  let y = m[1] ? Number(m[1]) : now.getFullYear();
  const pad = (n) => String(n).padStart(2, "0");
  if (!m[1]) {
    const cand = new Date(y, mo - 1, d);
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    if (cand < today - 30 * 86400000) y += 1;
  }
  return `${y}-${pad(mo)}-${pad(d)}`;
}

const LABELS = { placeName: /^(?:店名|店舗名|名前|スポット名|施設名|場所名)\s*[:：]?\s*/, memo: /^(?:メモ|memo|備考|ひとこと|コメント)\s*[:：]?\s*/i };

function parseFreeform(text, now = new Date()) {
  const raw = String(text || "").trim();
  const base = analyzeText(raw);
  const url = (raw.match(/https?:\/\/[^\s<>"'「」]+/) || [""])[0];
  const deadline = extractDeadline(raw, now);
  let placeName = "";
  const memo = [];
  // 1行ずつ（1行しかなければ「、」「/」やスペースで区切って）何の情報かを見分ける
  // 緯度経度（「35.66, 139.70」）は位置として別に読むので、店名などと混ぜない
  const body = raw.replace(/-?\d{1,3}\.\d{3,}\s*[,，、]\s*-?\d{1,3}\.\d{3,}/g, " ").replace(/https?:\/\/[^\s<>"'「」]+/g, (u) => `\n${u}\n`);
  let parts = body.split(/\n+/).map((x) => x.trim()).filter(Boolean);
  let spaced = false;
  if (parts.length === 1) parts = parts[0].split(/[、,，／/｜|]|\s{2,}/).map((x) => x.trim()).filter(Boolean);
  if (parts.length === 1 && /\s/.test(parts[0])) { parts = parts[0].split(/\s+/); spaced = true; }
  const genreWords = GENRES.flatMap((g) => [g.label, ...g.words]).map((w) => w.toLowerCase());
  let nameAt = -2;
  let prevGenre = "";
  const genreOnly = [];
  for (const [i, part] of parts.entries()) {
    if (LABELS.placeName.test(part)) { placeName = part.replace(LABELS.placeName, "").trim(); continue; }
    if (LABELS.memo.test(part)) { memo.push(part.replace(LABELS.memo, "").trim()); continue; }
    const info =
      /https?:\/\//.test(part) ||
      /[¥￥]\s*\d|\d[\d,]*\s*(円|yen)|無料/.test(part) ||
      TIME_RANGE.test(part) ||
      /[月火水木金土日](曜日?|曜)?\s*(定休|休み|休業|休館)|不定休|無休/.test(part) ||
      /駅/.test(part) ||
      new RegExp(`^(${PREFS})|[市区町村]\\S*\\d`).test(part) ||
      /^(徒歩|歩いて)\s*[0-9０-９]+\s*分?$|^[0-9０-９]+\s*分$/.test(part) ||
      /^(住所|営業時間|定休日|アクセス|時間|予算|値段|価格)/.test(part) ||
      /^[#＃]/.test(part) ||
      (extractDeadline(part, now) && /(まで|迄|〆|終了|[〜~～])/.test(part));
    const isGenreWord = genreWords.includes(part.toLowerCase());
    // スペース区切りの1行（「カフェ ルミエール 表参道駅…」）では、続いている言葉をまとめて店名にする
    if (spaced && !info && placeName && nameAt === i - 1 && placeName.length + part.length < 30) { placeName += ` ${part}`; nameAt = i; continue; }
    if (isGenreWord && !info) { prevGenre = part; genreOnly.push(part); continue; }
    if (info) {
      // 「10/31までの限定パフェ」のように、期限の後ろに言葉が続くならメモにも残す（住所の「4-12」は日付とみなさない）
      const hasDeadline = extractDeadline(part, now) && /(まで|迄|〆|終了|[〜~～])/.test(part);
      const rest = !hasDeadline ? part : part.replace(/(?:[〜~～]\s*)?(?:\d{4}\s*[\/年.\-]\s*)?\d{1,2}\s*[\/月.\-]\s*\d{1,2}\s*日?\s*(まで(の)?|迄|〆|終了)?/, "").trim();
      if (deadline && rest && rest !== part && rest.length >= 2 && !/^(まで|限定)$/.test(rest)) memo.push(part);
      continue;
    }
    if (!placeName && !base.placeName && part.length <= 40) {
      placeName = spaced && prevGenre && parts[i - 1] === prevGenre ? `${prevGenre} ${part}` : part;
      nameAt = i;
      continue;
    }
    memo.push(part);
  }
  // 都道府県のない住所（「渋谷区神宮前4-12-10」）も拾う
  let address = base.address;
  if (!address) {
    const a = raw.match(/[^\s、,，／/｜|]*?[市区町村][^\s、,，／/｜|]*?\d[\d\-−－‐ー丁目番地号の]*/);
    if (a) address = withBuilding(raw, a.index + a[0].length, a[0]);
  }
  const city = address ? cityFromAddress(address, base.prefecture) : base.city;
  // 「バー 夜景」のようにジャンルの言葉しかないときは、それを仮の名前にする
  if (!placeName && !base.placeName && genreOnly.length) placeName = genreOnly.join(" ").slice(0, 40);
  const out = { ...base, address, city, placeName: placeName || base.placeName, deadline, memo: memo.join(" / ").slice(0, 300), url: url ? normalizeUrl(url) : "" };
  if (out.url) out.platform = detectPlatform(out.url);
  // 店名からもジャンルを推測する
  if (out.genre === "other" && out.placeName) out.genre = classifyGenre(out.placeName);
  return out;
}

// AIの答えを形のうえで確かめる（ありえない都道府県・日付・値段は捨てる、駅名と市区町村をそろえる）
function cleanAiResult(ai) {
  if (!ai || typeof ai !== "object") return null;
  const out = { ...ai };
  const str = (v) => (v == null ? "" : String(v).trim());
  for (const k of ["placeName", "address", "prefecture", "city", "station", "hours", "closed", "deadline", "summary"]) out[k] = str(out[k]);
  if (out.prefecture && !PREF_LIST.includes(out.prefecture)) out.prefecture = PREF_LIST.find((p) => p.startsWith(out.prefecture.replace(/[都道府県]$/, ""))) || "";
  if (!out.prefecture && out.address) out.prefecture = PREF_LIST.find((p) => out.address.startsWith(p)) || "";
  if (out.station) {
    out.station = out.station.replace(/(駅).*$/, "$1");
    if (!out.station.endsWith("駅") && out.station.length <= 12) out.station += "駅";
  }
  if (out.address && (!out.city || !/\d/.test(out.city))) {
    const full = cityFromAddress(out.address, out.prefecture);
    if (full && (!out.city || full.startsWith(out.city))) out.city = full;
  }
  const d = out.deadline.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!d || Number.isNaN(new Date(out.deadline).getTime()) || Number(d[2]) > 12) out.deadline = "";
  const num = (v, max) => (v == null || v === "" || !Number.isFinite(Number(v)) || Number(v) < 0 || Number(v) > max ? null : Math.round(Number(v)));
  out.priceMin = num(out.priceMin, 500000);
  out.priceMax = num(out.priceMax, 500000);
  if (out.priceMin != null && out.priceMax != null && out.priceMax < out.priceMin) [out.priceMin, out.priceMax] = [out.priceMax, out.priceMin];
  if (out.priceMin == null && out.priceMax != null) out.priceMin = out.priceMax;
  out.walkMin = num(out.walkMin, 90);
  if (!GENRES.some((g) => g.id === out.genre)) out.genre = "other";
  if (out.lat != null) { const lat = Number(out.lat), lng = Number(out.lng); if (!(lat > 20 && lat < 46 && lng > 122 && lng < 154)) { delete out.lat; delete out.lng; } }
  return out;
}

// AIへの指示文（Webアプリのサーバーとアーティファクト版で共通）


// ジャンルの意味（AIが迷わないように例つきで渡す）
const GENRE_GUIDE = GENRES.filter((g) => g.id !== "other").map((g) => `${g.id}（${g.label}）: ${g.words.slice(0, 6).join("・")}など`).join("\n") + "\nother（その他）: どれにも当てはまらないとき";

const EXTRACT_RULES = `次のルールで読み取ってください。
- placeName: 店名・施設名・スポット名だけ（「【】」や絵文字、宣伝文句は外す）。投稿に複数の店が出てくるときは、いちばん中心になっている1つ。
- address: 都道府県から番地・建物名まで。わかる範囲で。郵便番号は含めない。
- prefecture: 都道府県名（例: 東京都・大阪府・北海道）。住所や駅・地名から確実にわかるときだけ。
- city: 都道府県を除いた住所の残り全部（市区町村から番地・建物名・階まで）。例: 住所が「東京都渋谷区神宮前4-12-10 2F」なら「渋谷区神宮前4-12-10 2F」。
- station: 最寄り駅（「〜駅」まで）。walkMin: 駅からの徒歩分数（書いてあれば）。
- genre: 下のジャンルから1つ。お店の主な目的で選ぶ（パフェが名物のカフェなら sweets、パンが主ならcafe など）。
- priceMin / priceMax: 1人あたりの円。メニューの価格帯・入場料・予算から。「無料」は0。セット価格しかなければそれを使う。書いていなければ null（推測しない）。
- hours: 営業時間（例: 11:00〜20:00、ランチ・ディナーが分かれていれば両方）。期間限定イベントは開催期間。
- closed: 定休日（例: 火曜、水・木曜、不定休）。
- deadline: 期間限定なら終了日を YYYY-MM-DD で（年がなければ今日以降で一番近い日付）。期間限定でなければ空文字。
- summary: どんな場所かを40字以内で。投稿の雰囲気を残して。
書かれていないことは作らず、空文字か null にしてください。`;

function hintsText(hints) {
  if (!hints) return "";
  const keys = ["placeName", "address", "prefecture", "city", "station", "walkMin", "genre", "priceMin", "priceMax", "hours", "closed", "deadline"];
  const h = Object.fromEntries(keys.filter((k) => hints[k] != null && hints[k] !== "" && hints[k] !== "other").map((k) => [k, hints[k]]));
  return Object.keys(h).length ? `\n<rule_based_guess>（機械的に読み取った候補。間違っていれば直してください）\n${JSON.stringify(h)}\n</rule_based_guess>` : "";
}

const ROUTE_RULES = `日本国内の移動として、具体的な行き方を答えてください。
- 実在する路線名・駅名・空港名・バス路線（わかる範囲）で、乗り換えの駅も書く。
- steps は順番どおり。type は walk / train / subway / shinkansen / bus / highway_bus / plane / car / taxi / transfer のどれか。
- minutes はそのステップのおおよその分数。fareYen は片道1人のおおよその合計（車は1台のガソリン・高速代、わからなければ null）。
- 時刻表や運行状況はわからないので、note に「時刻は乗換案内で確認」などの注意を短く。
- 指定された手段で行くのが現実的でなければ、その理由を note に書き、現実的な代わりの行き方を steps に。`;


// 手入力のメモ（投稿ではない）から読むときの追加ルール。実在の有名店などは知識で補ってよい
const MEMO_RULES = `これはSNSの投稿ではなく、使う人が思いつくまま短く書いたメモです。
- メモに書かれていることを最優先にしてください。
- 店名・施設名がはっきりしていて、実在する場所だとあなたが確信できるときだけ、あなたの知識で住所・最寄り駅・ジャンル・おおよその値段を補ってください。確信がない項目は空文字か null にします。
- 「表参道のパンケーキ屋」のように店名がなければ、placeName は「表参道のパンケーキ屋さん」のような短い呼び名にし、エリア（都道府県・市区町村・駅）とジャンルを読み取ってください。
- 営業時間・定休日・期限は、メモに書いてあるときだけ入れてください。
- summary はメモの内容を自然な一文に。`;

// 画面とテストの両方から使う計算まわり

function distanceKm(a, b) {
  const R = 6371;
  const toRad = (d) => (d * Math.PI) / 180;
  const dLat = toRad(b.lat - a.lat);
  const dLng = toRad(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

// 直線距離から移動時間の目安を出す（経路検索APIなしで動かすための概算）。
// 道のりは直線の約1.3倍、電車は乗り換え・待ち時間込みで遠いほど速くなる想定。
function estimateTravel(from, to) {
  const km = distanceKm(from, to);
  const road = km * 1.3;
  const walk = km <= 2.5 ? Math.max(1, Math.round((road / 4.5) * 60)) : null;
  // 平均速度(km/h)は距離が長いほど上がる（近場は乗り換え・信号が多く、遠くは特急・新幹線・高速道路）
  const trainSpeed = Math.min(150, 20 + road * 0.5);
  const train = Math.round(10 + (road / trainSpeed) * 60);
  const carSpeed = Math.min(70, 18 + road * 0.6);
  const car = Math.round(5 + (road / carSpeed) * 60);
  // 歩いて15分以内なら徒歩、それ以外は電車と車の速いほう
  const best = walk != null && walk <= 15 ? walk : Math.min(train, car);
  return { km, walk, train, car, best };
}

  if (min < 60) return `${min}分`;
  const h = Math.floor(min / 60);

}

  if (it.priceMax == null || it.priceMax === it.priceMin) return `${f(it.priceMin)}〜`;

function relativeDate(iso) {
  const diff = (Date.now() - new Date(iso)) / 1000;
  if (diff < 60) return "たった今";
  if (diff < 3600) return `${Math.floor(diff / 60)}分前`;
  if (diff < 86400) return `${Math.floor(diff / 3600)}時間前`;
  if (diff < 86400 * 7) return `${Math.floor(diff / 86400)}日前`;
  const d = new Date(iso);
  const sameYear = d.getFullYear() === new Date().getFullYear();
  return `${sameYear ? "" : d.getFullYear() + "/"}${d.getMonth() + 1}/${d.getDate()}`;
}

// 何人が「行きたい」ならマッチとするか。2人までは全員、3人以上は過半数（最低2人）
function requiredYes(memberCount) {
  if (memberCount <= 2) return Math.max(1, memberCount);
  return Math.max(2, Math.ceil(memberCount / 2));
}

const WEEKDAYS = ["日", "月", "火", "水", "木", "金", "土"];

const toHalf = (s) =>
  String(s || "")
    .replace(/[０-９]/g, (d) => String.fromCharCode(d.charCodeAt(0) - 0xfee0))
    .replace(/[：]/g, ":")
    .replace(/[〜～－ー―‐–—]/g, "-");

// 「11:30〜22:00」「10時〜19時」「17:00-翌2:00」「24時間営業」「火曜定休」「定休日: 水・木」などを読む
function parseHours(hours, closed = "") {
  const h = toHalf(hours);
  const c = toHalf(closed);
  if (!h.trim() && !c.trim()) return null;
  const T = String.raw`(\d{1,2})(?::(\d{2})|時(?:(\d{1,2})分?)?)`;
  const re = new RegExp(`${T}\\s*-\\s*(翌)?\\s*${T}`, "g");
  const ranges = [];
  let m;
  while ((m = re.exec(h))) {
    const s = Number(m[1]) * 60 + Number(m[2] || m[3] || 0);
    let e = Number(m[5]) * 60 + Number(m[6] || m[7] || 0);
    if (m[4] || e <= s) e += 1440;
    if (s < 1440 && e <= 2880) ranges.push([s, e]);
  }
  const allDay = /24\s*時間/.test(h);
  // 休みの曜日：「曜日」の「日」を日曜と取り違えないよう先に消す
  const closedText = [c, ...(h.match(/[月火水木金土日・、,／/\s]+曜?(?:日)?\s*(?:定休|休み|休業|休館)/g) || [])].join(" ");
  const days = new Set();
  const irregular = /不定休/.test(closedText + h);
  const noHoliday = /無休/.test(closedText + h);
  if (!noHoliday) {
    const cleaned = closedText.replace(/曜日/g, "曜").replace(/祝日?|祭日|年末年始|お盆|不定休|第\d/g, "").replace(/曜/g, "");
    WEEKDAYS.forEach((d, i) => { if (cleaned.includes(d)) days.add(i); });
  }
  if (!ranges.length && !allDay && !days.size && !irregular) return null;
  return { ranges, allDay, closedDays: days, irregular };
}

// 今（または指定時刻）に開いているか。わからないときは null
function openState(spot, date = new Date()) {
  const p = parseHours(spot.hours, spot.closed);
  if (!p) return null;
  if (p.closedDays.has(date.getDay())) return { state: "closed", label: "今日は定休日" };
  if (p.allDay) return { state: "open", label: "24時間営業" };
  if (!p.ranges.length) return null;
  const now = date.getHours() * 60 + date.getMinutes();
  for (const [s, e] of p.ranges) {
    for (const t of [now, now + 1440]) {
      if (t >= s && t < e) {
        const left = e - t;
        const close = `${String(Math.floor((e % 1440) / 60)).padStart(2, "0")}:${String(e % 60).padStart(2, "0")}`;
        return left <= 60 ? { state: "closing", label: `まもなく閉店（${close}まで）` } : { state: "open", label: `営業中（${close}まで）` };
      }
    }
  }
  const next = p.ranges.map(([s]) => s).filter((s) => s > now).sort((a, b) => a - b)[0];
  return { state: "closed", label: next != null ? `${String(Math.floor(next / 60)).padStart(2, "0")}:${String(next % 60).padStart(2, "0")}から営業` : "営業時間外" };
}

function seasonOf(spot, date = new Date()) {
  const text = [spot.title, spot.placeName, spot.caption, spot.summary, spot.memo, ...(spot.tags || [])].join(" ");

function loveScore(spot, required) {
  const likes = Object.values(spot.likes || {});
  const yes = likes.filter((v) => v === true).length;
  const no = likes.filter((v) => v === "no").length;
  let s = yes >= required ? 3 : yes ? 1 + yes * 0.5 : 0.5;
  s -= no * 2;
  if (seasonOf(spot)?.now) s += 1;
  if (spot.deadline) {
    const d = (new Date(spot.deadline + "T23:59:59") - Date.now()) / 86400000;
    if (d >= 0 && d <= 21) s += 1.5;
  }
  if (spot.pinned) s += 0.5;
  return s;
}

const moodText = (s) => [s.placeName, s.title, s.summary, s.memo, (s.tags || []).join(" "), String(s.caption || "").slice(0, 300)].join(" ");

// エリアの指定：{ id } で上の一覧、{ prefecture } で都道府県、{ lat, lng, r } で任意の範囲
function inArea(spot, area) {
  if (!area) return true;
  if (area.prefecture) return spot.prefecture === area.prefecture;
  const a = area.lat != null ? area : AREAS.find((x) => x.id === area.id);
  if (!a || spot.lat == null || spot.lng == null) return false;

// 行きたい場所から、近い場所どうしを組み合わせて回る順番と時間割を作る
// 1区間の移動手段・時間・1人あたりの交通費（車は人数で割る）
function legInfo(a, b, people = 2) {
  const tr = estimateTravel(a, b);
  const road = tr.km * 1.3;
  const mode = tr.walk != null && tr.walk <= 20 ? "徒歩" : tr.train <= tr.car + 10 ? "電車" : "車";
  const min = mode === "徒歩" ? tr.walk : mode === "電車" ? tr.train : tr.car;
  const fare = mode === "徒歩" ? 0 : mode === "電車" ? Math.round((140 + road * 17) / 10) * 10 : Math.round(((road * 12 + (road > 30 ? road * 22 : 0)) / Math.max(1, people)) / 10) * 10;
  return { mode, min, km: tr.km, fare };
}

function buildCourses(spots, { stops = 3, style = "day", start = null, budget = null, budgetMin = null, bothOnly = false, date = null, peopleCount = 2, base = null, limit = 3, moods = [], area = null } = {}) {
  const required = requiredYes(peopleCount);
  stops = Math.max(1, Math.min(10, Math.round(stops) || 3));
  const plan = startPlan(style, start);
  // 夜まで続くコースならバーも入れる（10か所なら朝からでも夜になる）
  const lateEnough = plan.start + stops * 100 >= 18 * 60;
  const day = date ? new Date(date + "T12:00:00") : new Date();
  const pool = spots.filter((s) => {
    if ((s.status || "want") === "visited" || s.lat == null || s.lng == null) return false;
    const yes = Object.values(s.likes || {}).filter((v) => v === true).length;
    if (bothOnly && yes < required) return false;
    // 半分以上が「うーん」の場所は入れない
    if (Object.values(s.likes || {}).filter((v) => v === "no").length * 2 >= Math.max(2, peopleCount)) return false;
    if (budget != null && s.priceMin != null && s.priceMin > budget) return false;
    if (!lateEnough && s.genre === "bar") return false;
    if (s.genre === "stay") return false; // 宿は日帰りコースに入れない
    if (!inArea(s, area)) return false;
    if (moods.length && moodAvoids(s, moods)) return false;
    return true;
  });
  // 気分に合う場所ほど選ばれやすく、コースの起点にもなりやすい
  const scored = pool.map((s) => ({ s, score: loveScore(s, required) + moodScore(s, moods) * 1.2 })).sort((a, b) => b.score - a.score);
  const seen = new Set();
  const courses = [];
  for (const { s: anchor } of scored.slice(0, 15)) {
    for (const radius of stops <= 4 ? [2, 6, 15] : [3, 8, 20, 40]) {
      const near = scored
        .filter(({ s }) => s !== anchor && distanceKm(anchor, s) <= radius)
        .sort((a, b) => b.score - a.score - (distanceKm(anchor, a.s) - distanceKm(anchor, b.s)) * 0.4);
      const picked = [anchor];
      for (const { s } of near) {
        if (picked.length >= stops) break;
        // 同じジャンルは、少ない数のコースでは1つまで。多いときは2つまで（ランチとディナーなど）
        const same = picked.filter((p) => p.genre === s.genre).length;
        if (s.genre !== "other" && same >= (stops <= 4 && !(moods.includes("gourmet") && ["gourmet", "sweets"].includes(s.genre)) ? 1 : 2)) continue;
        picked.push(s);
      }
      if (picked.length < Math.min(2, stops)) continue;
      const key = picked.map((p) => p.id).sort().join("|");
      if (seen.has(key)) break;
      seen.add(key);
      const c = timeline(picked, plan, day, required, base, peopleCount);
      if (moods.length) { const fit = picked.reduce((n, p) => n + moodScore(p, moods), 0); c.score += fit * 0.6; c.moods = moods.filter((id) => picked.some((p) => moodScore(p, [id]) >= 2)).map((id) => ({ id, full: picked.filter((p) => moodScore(p, [id]) >= 2).length * 2 >= picked.length })); }
      if (picked.length < stops) c.warnings.unshift(`行きたい場所が近くに足りず、${picked.length}か所のコースです`);
      courses.push(c);
      break;
    }
  }
  // 予算は「スポット代＋交通費（行き帰り込み）」の1人あたり合計で判定する
  const fit = courses.filter((c) => (budget == null || c.total <= budget) && (budgetMin == null || c.total >= budgetMin));
  // 頼んだ数をそろえられたコースを先に
  return fit.sort((a, b) => b.stops.length - a.stops.length || b.score - a.score).slice(0, limit);
}

// 何日から何日まで：日ごとに作って、営業日などで一番よい日を選ぶ（同じ組み合わせは一番よい日だけ残す）
function buildCoursesRange(spots, { dateFrom, dateTo = null, ...opts } = {}) {
  const days = [];
  const d = new Date((dateFrom || new Date().toISOString().slice(0, 10)) + "T12:00:00");
  const end = new Date((dateTo && dateTo >= dateFrom ? dateTo : dateFrom || d.toISOString().slice(0, 10)) + "T12:00:00");
  while (d <= end && days.length < 31) { days.push(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`); d.setDate(d.getDate() + 1); }
  const best = new Map();
  for (const date of days) {
    for (const c of buildCourses(spots, { ...opts, date, limit: 6 })) {
      const key = c.stops.map((x) => x.spot.id).sort().join("|");
      const prev = best.get(key);
      if (!prev || c.score > prev.score + 0.01) best.set(key, { ...c, date });
    }
  }
  return [...best.values()].sort((a, b) => b.stops.length - a.stops.length || b.score - a.score || a.date.localeCompare(b.date)).slice(0, days.length > 1 ? 5 : 3);
}

function timeline(picked, plan, day, required, base = null, people = 2) {
  // 2軒目のごはんは夕食にまわす
  const ideal = new Map();
  let meals = 0;
  for (const p of picked) ideal.set(p, p.genre === "gourmet" && meals++ > 0 ? Math.max(18.5 * 60, plan.gourmet + 300) : idealMinute(p.genre, plan));
  const im = (x) => ideal.get(x);
  // 理想の時間帯順に並べてから、移動が往復にならないよう隣どうしを入れ替えて詰める
  let order = [...picked].sort((a, b) => im(a) - im(b));
  for (let pass = 0; pass < 2; pass++) {
    for (let i = 0; i < order.length - 2; i++) {
      const [a, b, c] = order.slice(i, i + 3);
      if (distanceKm(a, c) + distanceKm(c, b) + 0.5 < distanceKm(a, b) + distanceKm(b, c) && Math.abs(im(b) - im(c)) <= 180) {
        order = [...order.slice(0, i + 1), c, b, ...order.slice(i + 3)];
      }
    }
  }
  let t = plan.start; // 出発の時刻から始める
  const stops = [];
  const warnings = [];
  let km = 0;
  let budget = 0;
  let unknownPrice = false;
  let transport = 0;
  order.forEach((spot, i) => {
    let leg = null;
    if (i > 0) {
      leg = legInfo(order[i - 1], spot, people);
      km += leg.km;
      transport += leg.fare;
      t = Math.ceil((t + leg.min) / 5) * 5; // 到着時刻は5分単位にそろえる
    }
    // ごはんは食事どきまで待つ
    if (spot.genre === "gourmet" && t < im(spot) - 30) t = im(spot) - 30;
    const stay = STAY[spot.genre] ?? 60;
    const when = new Date(day);
    when.setHours(Math.floor(t / 60), t % 60, 0, 0);
    const open = openState(spot, when);
    if (open && open.state === "closed") warnings.push(`${spot.placeName || spot.title}は${fmt(t)}ごろ営業していないかもしれません`);
    stops.push({ spot, arrive: fmt(t), leave: fmt(t + stay), stay, leg });
    t += stay;
    if (spot.priceMin != null) budget += spot.priceMin;
    else unknownPrice = true;
  });
  // 出発地からの行きと、最後の場所からの帰り
  if (t > 23.5 * 60) warnings.push("終わりが遅くなりそうです。回る数を減らすか、早めに出発しましょう");
  const access = base ? { go: legInfo(base, order[0], people), back: legInfo(order[order.length - 1], base, people) } : null;
  if (access) transport += access.go.fare + access.back.fare;
  const score = order.reduce((s, x) => s + loveScore(x, required), 0) - km * 0.25 - warnings.length - transport / 4000;
  const area = order[0].station?.replace(/駅$/, "") || (String(order[0].city || "").match(/^.*?[市区町村]/) || [order[0].city])[0] || order[0].prefecture || "";
  return { stops, warnings, km, budget, transport, total: budget + transport, access, unknownPrice, score, area, start: stops[0].arrive, end: stops[stops.length - 1].leave };
}

const enc = encodeURIComponent;
function spotQuery(s) {
  return [s.placeName || s.title, s.city || s.prefecture].filter(Boolean).join(" ");
}
function mapsUrl(s) {
  const q = s.placeName ? spotQuery(s) : s.lat != null ? `${s.lat},${s.lng}` : spotQuery(s);
  return `https://www.google.com/maps/search/?api=1&query=${enc(q || "")}`;
}
function routeUrl(s, base, mode = "transit") {
  const dest = s.lat != null ? `${s.lat},${s.lng}` : spotQuery(s);
  return `https://www.google.com/maps/dir/?api=1${base ? `&origin=${base.lat},${base.lng}` : ""}&destination=${enc(dest)}&travelmode=${mode}`;
}
function courseRouteUrl(stops) {
  const pt = (s) => (s.lat != null ? `${s.lat},${s.lng}` : spotQuery(s));
  const all = stops.map((x) => x.spot || x);
  const allWalk = stops.every((x, i) => i === 0 || x.leg?.mode === "徒歩");
  const mid = all.slice(1, -1).map(pt).join("|");
  return `https://www.google.com/maps/dir/?api=1&origin=${enc(pt(all[0]))}&destination=${enc(pt(all[all.length - 1]))}${mid ? `&waypoints=${enc(mid)}` : ""}&travelmode=${allWalk ? "walking" : "driving"}`;
}
function calendarUrl(s, date, startHM = "", minutes = 120) {
  const d = (date || new Date().toISOString().slice(0, 10)).replace(/-/g, "");
  let dates;
  if (startHM) {
    const [h, m] = startHM.split(":").map(Number);
    const end = h * 60 + m + minutes;
    dates = `${d}T${String(h).padStart(2, "0")}${String(m).padStart(2, "0")}00/${d}T${String(Math.floor(end / 60) % 24).padStart(2, "0")}${String(end % 60).padStart(2, "0")}00`;
  } else {
    const next = new Date(date ? date + "T12:00:00" : Date.now());
    next.setDate(next.getDate() + 1);
    dates = `${d}/${next.toISOString().slice(0, 10).replace(/-/g, "")}`;
  }
  const details = [s.url, s.memo].filter(Boolean).join("\n");
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${enc(s.placeName || s.title || "おでかけ")}&dates=${dates}&details=${enc(details)}&location=${enc(s.address || spotQuery(s))}`;
}
function icsText(s, date) {
  const d = (date || new Date().toISOString().slice(0, 10)).replace(/-/g, "");
  const esc = (t) => String(t || "").replace(/[\\;,]/g, (c) => "\\" + c).replace(/\n/g, "\\n");
  return ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//futari-ikitai//JA", "BEGIN:VEVENT", `UID:${s.id || Date.now()}@futari-ikitai`, `DTSTART;VALUE=DATE:${d}`,
    `SUMMARY:${esc(s.placeName || s.title)}`, `LOCATION:${esc(s.address || spotQuery(s))}`, `DESCRIPTION:${esc([s.url, s.memo].filter(Boolean).join("\n"))}`, "END:VEVENT", "END:VCALENDAR"].join("\r\n");
}
function lineShareUrl(text) {
  return `https://line.me/R/share?text=${enc(text)}`;
}
function spotShareText(s) {
  return [`📍${s.placeName || s.title}`, s.station || s.city || "", s.url || mapsUrl(s)].filter(Boolean).join("\n");
}

    if (post && !["instagram", "tiktok", "x", "youtube", "tabelog"].includes(plat)) sns.unshift({ app: ["threads", "lemon8", "googlemaps", "facebook"].includes(plat) ? plat : "web", name: platformLabel(plat), actions: [post] });
    if (q) sns.push({ app: "google", name: "Google", actions: [{ label: "検索", url: `https://www.google.com/search?q=${enc(q)}` }, { label: s.genre === "stay" ? "宿を予約" : "予約を探す", url: `https://www.google.com/search?q=${enc(q + (s.genre === "stay" ? " 宿泊 予約" : " 予約"))}` }] });

const FILLERS = /(っぽい|みたいな|みたいの|ような|ところ|とこ|場所|お店|やつ|って|けど|だっけ|かな|どこ|あれ|あの|その|見える|見つけた|見つけ|見た|行きたい|言ってた|気になる|教えて|探して|ある)/g;

// 文から「知っている言葉」（人の名前・条件・言いかえ辞書）を拾い、残りはおまけの手がかりにする
function fuzzySearch(spots, query, ctx = {}) {
  const c = { travelOf: () => null, members: {}, genres: [], now: Date.now(), ...ctx };
  let q = toHira(query);
  if (!q.trim()) return { results: [], understood: [] };
  const understood = new Set();
  const conds = [];
  const words = [];
  for (const [id, name] of Object.entries(c.members)) {
    const n = toHira(name);
    if (n && q.includes(n)) { conds.push({ test: (s) => s.addedBy === id }); understood.add(`${name}が見つけた`); q = q.split(n).join(" "); }
  }
  for (const r of FUZZY_RULES) {
    const w = [...r.words].map(toHira).sort((x, y) => y.length - x.length).find((x) => q.includes(x));
    if (w) { conds.push(r); understood.add(r.label); q = q.split(w).join(" "); }
  }
  // 長い言葉から先に当てる（「夜ごはん」を「夜」と読まないように）
  const used = new Set();
  for (const { w, g } of FUZZY_INDEX) {
    if (used.has(g) || !q.includes(w)) continue;
    used.add(g);
    words.push({ t: w, alts: g.map(toHira), required: true });
    understood.add(`${g[0]}っぽい`);
    q = q.split(w).join(" ");
  }
  for (const t of q.replace(FILLERS, " ").split(/[\s、。・！？!?がのでにをとへもはや]+/)) {
    if (t.length >= 2) words.push({ t, alts: [t], required: false });
  }
  const required = words.filter((w) => w.required);
  const results = [];
  for (const s of spots) {
    if (!conds.every((r) => r.test(s, c))) continue;
    const g = c.genres.find((x) => x.id === s.genre);
    const hay = toHira([s.placeName, s.title, s.caption, s.summary, s.memo, s.address, s.station, s.city, s.prefecture, g?.label, ...(g?.words || []), ...(s.tags || []), ...(s.comments || []).map((x) => x.text)].join(" "));
    let score = conds.length * 2;
    const hits = words.filter((w) => hay.includes(w.t) || w.alts.some((x) => hay.includes(x)));
    for (const w of hits) score += hay.includes(w.t) ? 3 : 2;
    // 辞書にある言葉が1つでもあれば、どれかに当たること。なければ残りの手がかりのどれかに当たること
    if (required.length ? !hits.some((w) => w.required) : !conds.length && !hits.length) continue;
    if (hits.length === words.length) score += 2;
    if ((s.status || "want") !== "visited") score += 0.3;
    results.push({ spot: s, score });
  }
  results.sort((a, b) => b.score - a.score || (b.spot.createdAt || "").localeCompare(a.spot.createdAt || ""));
  return { results, understood: [...understood] };
}

// ---------- メンバー図鑑（称号と相性） ----------
const GENRE_TITLES = {
  gourmet: "グルメハンター🍽️", cafe: "カフェ巡り隊☕", sweets: "甘党代表🍰", bar: "夜の案内人🍷", nature: "絶景ハンター🌅",
  sightseeing: "観光ガイド⛩️", art: "アート通🎨", event: "イベント番長🎪", shopping: "買い物マスター🛍️", stay: "温泉大臣♨️", activity: "アクティブ担当🎢",
};

// ふたりの「行きたい／うーん」がどれだけ一致したか。両方答えたスポットが2つ未満なら null
function compatibility(spots, a, b) {
  let both = 0, same = 0;
  for (const s of spots) {
    const va = s.likes?.[a], vb = s.likes?.[b];
    const ra = va === true ? 1 : va === "no" || va === false ? 0 : null;
    const rb = vb === true ? 1 : vb === "no" || vb === false ? 0 : null;
    if (ra == null || rb == null) continue;
    both++;
    if (ra === rb) same++;
  }
  return both >= 2 ? Math.round((same / both) * 100) : null;
}

function memberStats(spots, ids) {
  const base = ids.map((id) => {
    const added = spots.filter((s) => s.addedBy === id);
    const votes = spots.map((s) => s.likes?.[id]).filter((v) => v !== undefined && v !== null);
    const yes = votes.filter((v) => v === true).length;
    const no = votes.filter((v) => v === "no").length;
    const comments = spots.reduce((n, s) => n + (s.comments || []).filter((c) => c.by === id).length, 0);
    const byGenre = {};
    for (const s of added) byGenre[s.genre] = (byGenre[s.genre] || 0) + 1;
    const [topGenre, topGenreCount] = Object.entries(byGenre).sort((x, y) => y[1] - x[1])[0] || [null, 0];
    const visited = added.filter((s) => s.status === "visited").length;
    return { id, added: added.length, yes, no, votes: votes.length, comments, topGenre, topGenreCount, visited };
  });
  const maxAdded = Math.max(0, ...base.map((m) => m.added));
  const topAdders = base.filter((m) => m.added === maxAdded);
  const maxComments = Math.max(0, ...base.map((m) => m.comments));
  for (const m of base) {
    const titles = [];
    if (maxAdded >= 3 && topAdders.length === 1 && topAdders[0] === m) titles.push("発見王👑");
    if (m.topGenre && m.topGenreCount >= 2 && GENRE_TITLES[m.topGenre]) titles.push(GENRE_TITLES[m.topGenre]);
    if (m.votes >= 5 && m.yes / m.votes >= 0.8) titles.push("なんでも行きたい人🙌");
    if (m.votes >= 5 && m.no / m.votes >= 0.4) titles.push("こだわり審査員🧐");
    if (maxComments >= 3 && m.comments === maxComments) titles.push("おしゃべり隊長💬");
    if (!m.added && m.votes) titles.push("見る専門👀");
    if (!titles.length) titles.push("ゆるっと参加🌱");
    m.titles = titles;
  }
  // いちばん相性のいい組み合わせ
  let best = null;
  for (let i = 0; i < ids.length; i++) for (let j = i + 1; j < ids.length; j++) {
    const c = compatibility(spots, ids[i], ids[j]);
    if (c != null && (!best || c > best.score)) best = { a: ids[i], b: ids[j], score: c };
  }
  return { members: base, best };
}

// カレンダー用：月の日付マス（月曜はじまりではなく日曜はじまり）
function monthGrid(ym) {
  const [y, m] = ym.split("-").map(Number);
  const first = new Date(y, m - 1, 1);
  const days = new Date(y, m, 0).getDate();
  const cells = [];
  for (let i = 0; i < first.getDay(); i++) cells.push(null);
  for (let d = 1; d <= days; d++) cells.push(`${ym}-${String(d).padStart(2, "0")}`);
  while (cells.length % 7) cells.push(null);
  return cells;
}

function eventsOn(spots, date) {
  return {
    planned: spots.filter((s) => s.status === "planned" && s.plannedDate === date),
    deadline: spots.filter((s) => s.status !== "visited" && s.deadline === date),
    visited: spots.filter((s) => s.status === "visited" && s.visitedAt === date),
  };
}
